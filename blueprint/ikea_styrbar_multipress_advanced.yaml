blueprint:
  name: "ZHA - IKEA Styrbar N2 (4-Button) — Multipress 1–3 + UP/DOWN Long-Press Step"
  description: >
    Styrbar N2 blueprint with reliable multi-press (1–3) on all four buttons
    and UP/DOWN long-press stepping for light brightness, media volume, fan
    speed, climate temperature, and cover position.

    Long-press UP/DOWN fires one adjustment step per remote event — the remote
    sends repeated events while held, so no internal loop is needed. This makes
    long-press completely reliable with no risk of getting stuck.

    The long-press target entity is automatically extracted from whichever
    action was last fired — no separate entity inputs needed.

    Requires one input_text helper (max length >= 50).

  domain: automation

  input:

    remote:
      name: Styrbar Remote (ZHA)
      selector:
        device:
          integration: zha
          manufacturer: "IKEA of Sweden"
          model: "Remote Control N2"

    last_action_helper:
      name: Last Action Helper (input_text)
      description: >
        An input_text helper that tracks the last entity used by any button
        press, so UP/DOWN long-press knows what to adjust. Create an
        input_text helper in Settings → Helpers with max length >= 50.
        Each automation instance should have its own dedicated helper.
      selector:
        entity:
          domain: input_text

    press_timeout:
      name: Multi-press timeout (ms)
      description: >
        How long to wait after a press before deciding no further press is
        coming. For example at 500ms: press once and wait — after 500ms it
        fires single. Press twice within 500ms — it fires double. Increase
        if you find it hard to hit double/triple, decrease if single press
        feels sluggish.
      default: 500
      selector:
        number:
          min: 100
          max: 2000
          step: 100
          unit_of_measurement: milliseconds
          mode: slider

    brightness_step:
      name: Brightness / fan step (%)
      description: >
        How much to adjust brightness or fan speed per long-press event.
        For lights 10% is a good default. For fans with only 3 speeds
        (Low/Medium/High mapped to ~33/66/100%) use 34% so each step
        moves a full speed level.
      default: 10
      selector:
        number:
          min: 1
          max: 50
          step: 1

    cover_step:
      name: Cover position step (%)
      description: >
        How much to adjust cover position per long-press event.
        10% is a good default for most covers.
      default: 10
      selector:
        number:
          min: 1
          max: 50
          step: 1

    volume_step:
      name: Volume / climate step
      description: >
        How much to adjust media player volume or climate temperature per
        long-press event. 0.05 = 5% volume change per step.
      default: 0.05
      selector:
        number:
          min: 0.01
          max: 0.20
          step: 0.01

    debug_mode:
      name: Enable debug logging
      default: false
      selector:
        boolean: {}

    ############################################################
    # ACTION INPUTS
    ############################################################

    up_single_action:
      name: UP - Single Press
      selector: { action: {} }
      default: []

    up_double_action:
      name: UP - Double Press
      selector: { action: {} }
      default: []

    up_triple_action:
      name: UP - Triple Press
      selector: { action: {} }
      default: []

    down_single_action:
      name: DOWN - Single Press
      selector: { action: {} }
      default: []

    down_double_action:
      name: DOWN - Double Press
      selector: { action: {} }
      default: []

    down_triple_action:
      name: DOWN - Triple Press
      selector: { action: {} }
      default: []

    left_single_action:
      name: LEFT - Single Press
      selector: { action: {} }
      default: []

    left_double_action:
      name: LEFT - Double Press
      selector: { action: {} }
      default: []

    left_triple_action:
      name: LEFT - Triple Press
      selector: { action: {} }
      default: []

    right_single_action:
      name: RIGHT - Single Press
      selector: { action: {} }
      default: []

    right_double_action:
      name: RIGHT - Double Press
      selector: { action: {} }
      default: []

    right_triple_action:
      name: RIGHT - Triple Press
      selector: { action: {} }
      default: []

mode: single
max_exceeded: silent

trigger:
  - trigger: event
    event_type: zha_event
    event_data:
      device_id: !input remote

conditions:
  - condition: template
    value_template: >
      {{ trigger.event.data.command in ['on', 'off', 'press', 'release',
         'move_with_on_off', 'move', 'stop_with_on_off', 'stop'] }}
  # Reject attribute_updated events fired alongside on/off presses
  - condition: template
    value_template: "{{ trigger.event.data.command != 'attribute_updated' }}"

variables:
  helper: !input last_action_helper
  brightness_step: !input brightness_step
  cover_step: !input cover_step
  volume_step: !input volume_step
  debug: !input debug_mode

  command: "{{ trigger.event.data.command }}"
  cluster_id: "{{ trigger.event.data.cluster_id | default(-1) | int }}"

  # Resolved action lists for entity extraction
  up_single_action:    !input up_single_action
  up_double_action:    !input up_double_action
  up_triple_action:    !input up_triple_action
  down_single_action:  !input down_single_action
  down_double_action:  !input down_double_action
  down_triple_action:  !input down_triple_action
  left_single_action:  !input left_single_action
  left_double_action:  !input left_double_action
  left_triple_action:  !input left_triple_action
  right_single_action: !input right_single_action
  right_double_action: !input right_double_action
  right_triple_action: !input right_triple_action

  # Last entity stored in helper (for long-press targeting)
  last_entity: "{{ states(helper) }}"
  last_domain: >
    {% if last_entity and '.' in last_entity %}
      {{ last_entity.split('.')[0] }}
    {% else %}
      none
    {% endif %}

actions:

  ############################################################
  # DEBUG LOGGING
  ############################################################
  - if: "{{ debug }}"
    then:
      - service: system_log.write
        data:
          message: >
            STYRBAR DEBUG — command={{ command }}, cluster_id={{ cluster_id }},
            last_entity={{ last_entity }}, last_domain={{ last_domain }}
          level: info

  - choose:

      ##################################################################
      # UP BUTTON (command: "on", cluster_id: 6)
      # attribute_updated is now filtered at the conditions level so
      # wait_for_trigger only sees genuine command: "on" events,
      # giving exactly 1 event per physical press.
      ##################################################################
      - conditions:
          - condition: template
            value_template: "{{ command == 'on' }}"
        sequence:
          - wait_for_trigger:
              - trigger: event
                event_type: zha_event
                event_data:
                    device_id: !input remote
                    cluster_id: 6
                    command: "on"
            timeout:
              milliseconds: !input press_timeout
            continue_on_timeout: true
          - if:
              - condition: template
                value_template: "{{ wait.trigger is none }}"
            then:
              # SINGLE
              - sequence: !input up_single_action
              - variables:
                  _entity: >
                    {% set a = up_single_action %}
                    {% set _eid = a[0].target.entity_id if (a | length > 0 and a[0].target is defined and a[0].target.entity_id is defined) else (a[0].data.entity_id if (a | length > 0 and a[0].data is defined and a[0].data.entity_id is defined) else last_entity) %}
                    {% if _eid is string %}{{ _eid }}{% elif _eid is iterable and _eid | length > 0 %}{{ _eid[0] }}{% else %}{{ last_entity }}{% endif %}
              - if: "{{ _entity not in ['', None, 'none'] }}"
                then:
                  - service: input_text.set_value
                    data:
                      entity_id: "{{ helper }}"
                      value: "{{ _entity }}"
            else:
              sequence:
                - wait_for_trigger:
                    - trigger: event
                      event_type: zha_event
                      event_data:
                          device_id: !input remote
                          cluster_id: 6
                          command: "on"
                  timeout:
                    milliseconds: !input press_timeout
                  continue_on_timeout: true
                - if:
                    - condition: template
                      value_template: "{{ wait.trigger is none }}"
                  then:
                    # DOUBLE
                    - sequence: !input up_double_action
                    - variables:
                        _entity: >
                          {% set a = up_double_action %}
                          {% set _eid = a[0].target.entity_id if (a | length > 0 and a[0].target is defined and a[0].target.entity_id is defined) else (a[0].data.entity_id if (a | length > 0 and a[0].data is defined and a[0].data.entity_id is defined) else last_entity) %}
                          {% if _eid is string %}{{ _eid }}{% elif _eid is iterable and _eid | length > 0 %}{{ _eid[0] }}{% else %}{{ last_entity }}{% endif %}
                    - if: "{{ _entity not in ['', None, 'none'] }}"
                      then:
                        - service: input_text.set_value
                          data:
                            entity_id: "{{ helper }}"
                            value: "{{ _entity }}"
                  else:
                    # TRIPLE
                    - sequence: !input up_triple_action
                    - variables:
                        _entity: >
                          {% set a = up_triple_action %}
                          {% set _eid = a[0].target.entity_id if (a | length > 0 and a[0].target is defined and a[0].target.entity_id is defined) else (a[0].data.entity_id if (a | length > 0 and a[0].data is defined and a[0].data.entity_id is defined) else last_entity) %}
                          {% if _eid is string %}{{ _eid }}{% elif _eid is iterable and _eid | length > 0 %}{{ _eid[0] }}{% else %}{{ last_entity }}{% endif %}
                    - if: "{{ _entity not in ['', None, 'none'] }}"
                      then:
                        - service: input_text.set_value
                          data:
                            entity_id: "{{ helper }}"
                            value: "{{ _entity }}"

      ##################################################################
      # DOWN BUTTON (command: "off", cluster_id: 6)
      # attribute_updated is now filtered at the conditions level so
      # wait_for_trigger only sees genuine command: "off" events,
      # giving exactly 1 event per physical press.
      ##################################################################
      - conditions:
          - condition: template
            value_template: "{{ command == 'off' }}"
        sequence:
          - wait_for_trigger:
              - trigger: event
                event_type: zha_event
                event_data:
                    device_id: !input remote
                    cluster_id: 6
                    command: "off"
            timeout:
              milliseconds: !input press_timeout
            continue_on_timeout: true
          - if:
              - condition: template
                value_template: "{{ wait.trigger is none }}"
            then:
              # SINGLE
              - sequence: !input down_single_action
              - variables:
                  _entity: >
                    {% set a = down_single_action %}
                    {% set _eid = a[0].target.entity_id if (a | length > 0 and a[0].target is defined and a[0].target.entity_id is defined) else (a[0].data.entity_id if (a | length > 0 and a[0].data is defined and a[0].data.entity_id is defined) else last_entity) %}
                    {% if _eid is string %}{{ _eid }}{% elif _eid is iterable and _eid | length > 0 %}{{ _eid[0] }}{% else %}{{ last_entity }}{% endif %}
              - if: "{{ _entity not in ['', None, 'none'] }}"
                then:
                  - service: input_text.set_value
                    data:
                      entity_id: "{{ helper }}"
                      value: "{{ _entity }}"
            else:
              sequence:
                - wait_for_trigger:
                    - trigger: event
                      event_type: zha_event
                      event_data:
                          device_id: !input remote
                          cluster_id: 6
                          command: "off"
                  timeout:
                    milliseconds: !input press_timeout
                  continue_on_timeout: true
                - if:
                    - condition: template
                      value_template: "{{ wait.trigger is none }}"
                  then:
                    # DOUBLE
                    - sequence: !input down_double_action
                    - variables:
                        _entity: >
                          {% set a = down_double_action %}
                          {% set _eid = a[0].target.entity_id if (a | length > 0 and a[0].target is defined and a[0].target.entity_id is defined) else (a[0].data.entity_id if (a | length > 0 and a[0].data is defined and a[0].data.entity_id is defined) else last_entity) %}
                          {% if _eid is string %}{{ _eid }}{% elif _eid is iterable and _eid | length > 0 %}{{ _eid[0] }}{% else %}{{ last_entity }}{% endif %}
                    - if: "{{ _entity not in ['', None, 'none'] }}"
                      then:
                        - service: input_text.set_value
                          data:
                            entity_id: "{{ helper }}"
                            value: "{{ _entity }}"
                  else:
                    # TRIPLE
                    - sequence: !input down_triple_action
                    - variables:
                        _entity: >
                          {% set a = down_triple_action %}
                          {% set _eid = a[0].target.entity_id if (a | length > 0 and a[0].target is defined and a[0].target.entity_id is defined) else (a[0].data.entity_id if (a | length > 0 and a[0].data is defined and a[0].data.entity_id is defined) else last_entity) %}
                          {% if _eid is string %}{{ _eid }}{% elif _eid is iterable and _eid | length > 0 %}{{ _eid[0] }}{% else %}{{ last_entity }}{% endif %}
                    - if: "{{ _entity not in ['', None, 'none'] }}"
                      then:
                        - service: input_text.set_value
                          data:
                            entity_id: "{{ helper }}"
                            value: "{{ _entity }}"

      # RIGHT BUTTON (args [256, 13, 0])
      ##################################################################
      - conditions:
          - condition: template
            value_template: "{{ command == 'press' and trigger.event.data.args == [256, 13, 0] }}"
        sequence:
          - wait_for_trigger:
              - trigger: event
                event_type: zha_event
                event_data:
                  device_id: !input remote
                  command: press
                  args: [256, 13, 0]
            timeout:
              milliseconds: !input press_timeout
            continue_on_timeout: true

          - if:
              - condition: template
                value_template: "{{ wait.trigger is none }}"
            then:
              # SINGLE
              - sequence: !input right_single_action
              - variables:
                  _entity: >
                    {% set a = right_single_action %}
                    {% set _eid = a[0].target.entity_id if (a | length > 0 and a[0].target is defined and a[0].target.entity_id is defined) else (a[0].data.entity_id if (a | length > 0 and a[0].data is defined and a[0].data.entity_id is defined) else last_entity) %}
                    {% if _eid is string %}{{ _eid }}{% elif _eid is iterable and _eid | length > 0 %}{{ _eid[0] }}{% else %}{{ last_entity }}{% endif %}
              - if: "{{ _entity not in ['', None, 'none'] }}"
                then:
                  - service: input_text.set_value
                    data:
                      entity_id: "{{ helper }}"
                      value: "{{ _entity }}"
            else:
              sequence:
                - wait_for_trigger:
                    - trigger: event
                      event_type: zha_event
                      event_data:
                        device_id: !input remote
                        command: press
                        args: [256, 13, 0]
                  timeout:
                    milliseconds: !input press_timeout
                  continue_on_timeout: true

                - if:
                    - condition: template
                      value_template: "{{ wait.trigger is none }}"
                  then:
                    # DOUBLE
                    - sequence: !input right_double_action
                    - variables:
                        _entity: >
                          {% set a = right_double_action %}
                          {% set _eid = a[0].target.entity_id if (a | length > 0 and a[0].target is defined and a[0].target.entity_id is defined) else (a[0].data.entity_id if (a | length > 0 and a[0].data is defined and a[0].data.entity_id is defined) else last_entity) %}
                          {% if _eid is string %}{{ _eid }}{% elif _eid is iterable and _eid | length > 0 %}{{ _eid[0] }}{% else %}{{ last_entity }}{% endif %}
                    - if: "{{ _entity not in ['', None, 'none'] }}"
                      then:
                        - service: input_text.set_value
                          data:
                            entity_id: "{{ helper }}"
                            value: "{{ _entity }}"
                  else:
                    # TRIPLE
                    - sequence: !input right_triple_action
                    - variables:
                        _entity: >
                          {% set a = right_triple_action %}
                          {% set _eid = a[0].target.entity_id if (a | length > 0 and a[0].target is defined and a[0].target.entity_id is defined) else (a[0].data.entity_id if (a | length > 0 and a[0].data is defined and a[0].data.entity_id is defined) else last_entity) %}
                          {% if _eid is string %}{{ _eid }}{% elif _eid is iterable and _eid | length > 0 %}{{ _eid[0] }}{% else %}{{ last_entity }}{% endif %}
                    - if: "{{ _entity not in ['', None, 'none'] }}"
                      then:
                        - service: input_text.set_value
                          data:
                            entity_id: "{{ helper }}"
                            value: "{{ _entity }}"

      ##################################################################
      # LEFT BUTTON (args [257, 13, 0])
      ##################################################################
      - conditions:
          - condition: template
            value_template: "{{ command == 'press' and trigger.event.data.args == [257, 13, 0] }}"
        sequence:
          - wait_for_trigger:
              - trigger: event
                event_type: zha_event
                event_data:
                  device_id: !input remote
                  command: press
                  args: [257, 13, 0]
            timeout:
              milliseconds: !input press_timeout
            continue_on_timeout: true

          - if:
              - condition: template
                value_template: "{{ wait.trigger is none }}"
            then:
              # SINGLE
              - sequence: !input left_single_action
              - variables:
                  _entity: >
                    {% set a = left_single_action %}
                    {% set _eid = a[0].target.entity_id if (a | length > 0 and a[0].target is defined and a[0].target.entity_id is defined) else (a[0].data.entity_id if (a | length > 0 and a[0].data is defined and a[0].data.entity_id is defined) else last_entity) %}
                    {% if _eid is string %}{{ _eid }}{% elif _eid is iterable and _eid | length > 0 %}{{ _eid[0] }}{% else %}{{ last_entity }}{% endif %}
              - if: "{{ _entity not in ['', None, 'none'] }}"
                then:
                  - service: input_text.set_value
                    data:
                      entity_id: "{{ helper }}"
                      value: "{{ _entity }}"
            else:
              sequence:
                - wait_for_trigger:
                    - trigger: event
                      event_type: zha_event
                      event_data:
                        device_id: !input remote
                        command: press
                        args: [257, 13, 0]
                  timeout:
                    milliseconds: !input press_timeout
                  continue_on_timeout: true

                - if:
                    - condition: template
                      value_template: "{{ wait.trigger is none }}"
                  then:
                    # DOUBLE
                    - sequence: !input left_double_action
                    - variables:
                        _entity: >
                          {% set a = left_double_action %}
                          {% set _eid = a[0].target.entity_id if (a | length > 0 and a[0].target is defined and a[0].target.entity_id is defined) else (a[0].data.entity_id if (a | length > 0 and a[0].data is defined and a[0].data.entity_id is defined) else last_entity) %}
                          {% if _eid is string %}{{ _eid }}{% elif _eid is iterable and _eid | length > 0 %}{{ _eid[0] }}{% else %}{{ last_entity }}{% endif %}
                    - if: "{{ _entity not in ['', None, 'none'] }}"
                      then:
                        - service: input_text.set_value
                          data:
                            entity_id: "{{ helper }}"
                            value: "{{ _entity }}"
                  else:
                    # TRIPLE
                    - sequence: !input left_triple_action
                    - variables:
                        _entity: >
                          {% set a = left_triple_action %}
                          {% set _eid = a[0].target.entity_id if (a | length > 0 and a[0].target is defined and a[0].target.entity_id is defined) else (a[0].data.entity_id if (a | length > 0 and a[0].data is defined and a[0].data.entity_id is defined) else last_entity) %}
                          {% if _eid is string %}{{ _eid }}{% elif _eid is iterable and _eid | length > 0 %}{{ _eid[0] }}{% else %}{{ last_entity }}{% endif %}
                    - if: "{{ _entity not in ['', None, 'none'] }}"
                      then:
                        - service: input_text.set_value
                          data:
                            entity_id: "{{ helper }}"
                            value: "{{ _entity }}"

      ##################################################################
      # UP LONG-PRESS (cluster 8, move_with_on_off)
      # No repeat loop — the Styrbar sends repeated move_with_on_off
      # events while held. Each one triggers the automation and fires
      # one step. stop_with_on_off falls through doing nothing.
      # This eliminates any possibility of a stuck loop.
      ##################################################################
      - conditions:
          - condition: template
            value_template: "{{ cluster_id == 8 and command == 'move_with_on_off' }}"
        sequence:
          - choose:
              - conditions: "{{ last_domain == 'light' }}"
                sequence:
                  - service: light.turn_on
                    data:
                      entity_id: "{{ last_entity }}"
                      brightness_step_pct: "{{ brightness_step | int }}"
              - conditions: "{{ last_domain == 'media_player' }}"
                sequence:
                  - service: media_player.volume_set
                    data:
                      entity_id: "{{ last_entity }}"
                      volume_level: >
                        {{ [ (state_attr(last_entity, 'volume_level') | float(0)) + (volume_step | float), 1.0 ] | min }}
              - conditions: "{{ last_domain == 'fan' }}"
                sequence:
                  - service: fan.set_percentage
                    data:
                      entity_id: "{{ last_entity }}"
                      percentage: >
                        {{ [ (state_attr(last_entity, 'percentage') | float(0)) + (brightness_step | int), 100 ] | min }}
              - conditions: "{{ last_domain == 'climate' }}"
                sequence:
                  - service: climate.set_temperature
                    data:
                      entity_id: "{{ last_entity }}"
                      temperature: >
                        {{ (state_attr(last_entity, 'temperature') | float(20)) + (volume_step | float) }}
              - conditions: "{{ last_domain == 'cover' }}"
                sequence:
                  - service: cover.set_cover_position
                    data:
                      entity_id: "{{ last_entity }}"
                      position: >
                        {{ [ (state_attr(last_entity, 'current_position') | float(0)) + (cover_step | int), 100 ] | min }}

      ##################################################################
      # DOWN LONG-PRESS (cluster 8, move)
      # Same approach — one step per move event, no loop.
      ##################################################################
      - conditions:
          - condition: template
            value_template: "{{ cluster_id == 8 and command == 'move' }}"
        sequence:
          - choose:
              - conditions: "{{ last_domain == 'light' }}"
                sequence:
                  - service: light.turn_on
                    data:
                      entity_id: "{{ last_entity }}"
                      brightness_step_pct: "{{ (brightness_step | int) * -1 }}"
              - conditions: "{{ last_domain == 'media_player' }}"
                sequence:
                  - service: media_player.volume_set
                    data:
                      entity_id: "{{ last_entity }}"
                      volume_level: >
                        {{ [ (state_attr(last_entity, 'volume_level') | float(0)) - (volume_step | float), 0.0 ] | max }}
              - conditions: "{{ last_domain == 'fan' }}"
                sequence:
                  - service: fan.set_percentage
                    data:
                      entity_id: "{{ last_entity }}"
                      percentage: >
                        {{ [ (state_attr(last_entity, 'percentage') | float(100)) - (brightness_step | int), 0 ] | max }}
              - conditions: "{{ last_domain == 'climate' }}"
                sequence:
                  - service: climate.set_temperature
                    data:
                      entity_id: "{{ last_entity }}"
                      temperature: >
                        {{ (state_attr(last_entity, 'temperature') | float(20)) - (volume_step | float) }}
              - conditions: "{{ last_domain == 'cover' }}"
                sequence:
                  - service: cover.set_cover_position
                    data:
                      entity_id: "{{ last_entity }}"
                      position: >
                        {{ [ (state_attr(last_entity, 'current_position') | float(100)) - (cover_step | int), 0 ] | max }}
