blueprint:
  name: "ZHA Events - IKEA Styrbar 4 Button Remote - Multipress (Advanced, Flat Inputs)"
  description: >
    Advanced multi-press and long-press automation for the IKEA Styrbar 4-button
    remote using ZHA. Supports 1–5 presses, long-press, hold-repeat brightness/
    volume control, optional entities, helper clearing, and full action mapping.

  domain: automation

  input:

    ############################################################
    # CORE INPUTS
    ############################################################

    remote:
      name: IKEA Styrbar remote control (4 buttons)
      description: "Select the Styrbar remote device."
      selector:
        device:
          integration: zha
          manufacturer: "IKEA of Sweden"
          model: "Remote Control N2"

    last_action_helper:
      name: Last Action Helper (input_text)
      description: >
        Stores the last entity used by any press. Long-press UP/DOWN adjusts
        brightness/volume of this entity. If a press has no entity configured,
        the helper is cleared.
      selector:
        entity:
          domain: input_text

    enable_up:
      name: Enable UP button group
      default: true
      selector:
        boolean: {}

    enable_down:
      name: Enable DOWN button group
      default: true
      selector:
        boolean: {}

    enable_left:
      name: Enable LEFT button group
      default: true
      selector:
        boolean: {}

    enable_right:
      name: Enable RIGHT button group
      default: true
      selector:
        boolean: {}

    press_timeout:
      name: Multi-press timeout (ms)
      default: 350
      selector:
        number:
          min: 150
          max: 1000
          step: 50
          unit_of_measurement: ms
          mode: slider

    hold_repeat_interval:
      name: Hold-repeat interval (ms)
      default: 300
      selector:
        number:
          min: 100
          max: 1000
          step: 50
          unit_of_measurement: ms
          mode: slider

    brightness_step:
      name: Brightness step (1–50)
      default: 10
      selector:
        number:
          min: 1
          max: 50
          step: 1
          mode: slider

    volume_step:
      name: Volume step (0.01–0.20)
      default: 0.05
      selector:
        number:
          min: 0.01
          max: 0.20
          step: 0.01
          mode: slider

    debug_mode:
      name: Enable debug logging
      default: false
      selector:
        boolean: {}

    ############################################################
    # UP BUTTON — ENTITY INPUTS
    ############################################################

    up_single_entity:
      name: UP — Single Press Entity
      selector:
        entity: {}
      default: ""

    up_double_entity:
      name: UP — Double Press Entity
      selector:
        entity: {}
      default: ""

    up_triple_entity:
      name: UP — Triple Press Entity
      selector:
        entity: {}
      default: ""

    up_quadruple_entity:
      name: UP — Quadruple Press Entity
      selector:
        entity: {}
      default: ""

    up_quintuple_entity:
      name: UP — Quintuple Press Entity
      selector:
        entity: {}
      default: ""

    up_long_entity:
      name: UP — Long Press Entity
      selector:
        entity: {}
      default: ""

    ############################################################
    # DOWN BUTTON — ENTITY INPUTS
    ############################################################

    down_single_entity:
      name: DOWN — Single Press Entity
      selector:
        entity: {}
      default: ""

    down_double_entity:
      name: DOWN — Double Press Entity
      selector:
        entity: {}
      default: ""

    down_triple_entity:
      name: DOWN — Triple Press Entity
      selector:
        entity: {}
      default: ""

    down_quadruple_entity:
      name: DOWN — Quadruple Press Entity
      selector:
        entity: {}
      default: ""

    down_quintuple_entity:
      name: DOWN — Quintuple Press Entity
      selector:
        entity: {}
      default: ""

    down_long_entity:
      name: DOWN — Long Press Entity
      selector:
        entity: {}
      default: ""

    ############################################################
    # LEFT BUTTON — ENTITY INPUTS
    ############################################################

    left_single_entity:
      name: LEFT — Single Press Entity
      selector:
        entity: {}
      default: ""

    left_double_entity:
      name: LEFT — Double Press Entity
      selector:
        entity: {}
      default: ""

    left_triple_entity:
      name: LEFT — Triple Press Entity
      selector:
        entity: {}
      default: ""

    left_quadruple_entity:
      name: LEFT — Quadruple Press Entity
      selector:
        entity: {}
      default: ""

    left_quintuple_entity:
      name: LEFT — Quintuple Press Entity
      selector:
        entity: {}
      default: ""

    left_long_entity:
      name: LEFT — Long Press Entity
      selector:
        entity: {}
      default: ""

    ############################################################
    # RIGHT BUTTON — ENTITY INPUTS
    ############################################################

    right_single_entity:
      name: RIGHT — Single Press Entity
      selector:
        entity: {}
      default: ""

    right_double_entity:
      name: RIGHT — Double Press Entity
      selector:
        entity: {}
      default: ""

    right_triple_entity:
      name: RIGHT — Triple Press Entity
      selector:
        entity: {}
      default: ""

    right_quadruple_entity:
      name: RIGHT — Quadruple Press Entity
      selector:
        entity: {}
      default: ""

    right_quintuple_entity:
      name: RIGHT — Quintuple Press Entity
      selector:
        entity: {}
      default: ""

    right_long_entity:
      name: RIGHT — Long Press Entity
      selector:
        entity: {}
      default: ""
    ############################################################
    # UP BUTTON — ACTION INPUTS
    ############################################################

    up_single_action:
      name: UP — Single Press Action
      selector:
        action: {}
      default: []

    up_double_action:
      name: UP — Double Press Action
      selector:
        action: {}
      default: []

    up_triple_action:
      name: UP — Triple Press Action
      selector:
        action: {}
      default: []

    up_quadruple_action:
      name: UP — Quadruple Press Action
      selector:
        action: {}
      default: []

    up_quintuple_action:
      name: UP — Quintuple Press Action
      selector:
        action: {}
      default: []

    up_long_action:
      name: UP — Long Press Action
      selector:
        action: {}
      default: []

    ############################################################
    # DOWN BUTTON — ACTION INPUTS
    ############################################################

    down_single_action:
      name: DOWN — Single Press Action
      selector:
        action: {}
      default: []

    down_double_action:
      name: DOWN — Double Press Action
      selector:
        action: {}
      default: []

    down_triple_action:
      name: DOWN — Triple Press Action
      selector:
        action: {}
      default: []

    down_quadruple_action:
      name: DOWN — Quadruple Press Action
      selector:
        action: {}
      default: []

    down_quintuple_action:
      name: DOWN — Quintuple Press Action
      selector:
        action: {}
      default: []

    down_long_action:
      name: DOWN — Long Press Action
      selector:
        action: {}
      default: []

    ############################################################
    # LEFT BUTTON — ACTION INPUTS
    ############################################################

    left_single_action:
      name: LEFT — Single Press Action
      selector:
        action: {}
      default: []

    left_double_action:
      name: LEFT — Double Press Action
      selector:
        action: {}
      default: []

    left_triple_action:
      name: LEFT — Triple Press Action
      selector:
        action: {}
      default: []

    left_quadruple_action:
      name: LEFT — Quadruple Press Action
      selector:
        action: {}
      default: []

    left_quintuple_action:
      name: LEFT — Quintuple Press Action
      selector:
        action: {}
      default: []

    left_long_action:
      name: LEFT — Long Press Action
      selector:
        action: {}
      default: []

    ############################################################
    # RIGHT BUTTON — ACTION INPUTS
    ############################################################

    right_single_action:
      name: RIGHT — Single Press Action
      selector:
        action: {}
      default: []

    right_double_action:
      name: RIGHT — Double Press Action
      selector:
        action: {}
      default: []

    right_triple_action:
      name: RIGHT — Triple Press Action
      selector:
        action: {}
      default: []

    right_quadruple_action:
      name: RIGHT — Quadruple Press Action
      selector:
        action: {}
      default: []

    right_quintuple_action:
      name: RIGHT — Quintuple Press Action
      selector:
        action: {}
      default: []

    right_long_action:
      name: RIGHT — Long Press Action
      selector:
        action: {}
      default: []
mode: restart
max_exceeded: silent

trigger:
  - platform: event
    event_type: zha_event
    event_data:
      device_id: !input remote

variables:

  # Core settings
  press_timeout: !input press_timeout
  hold_repeat_interval: !input hold_repeat_interval
  brightness_step: !input brightness_step
  volume_step: !input volume_step
  debug: !input debug_mode

  # Button enable toggles
  enable_up: !input enable_up
  enable_down: !input enable_down
  enable_left: !input enable_left
  enable_right: !input enable_right

  # Helper
  helper: !input last_action_helper
  last_entity: "{{ states(helper) }}"
  last_domain: >
    {% if last_entity and '.' in last_entity %}
      {{ last_entity.split('.')[0] }}
    {% else %}
      none
    {% endif %}

  # Extract ZHA event fields
  command: "{{ trigger.event.data.command }}"
  args: "{{ trigger.event.data.args | default({}) }}"

  # Determine button pressed
  button: >
    {% if command in ['on', 'move_with_on_off', 'step_with_on_off'] %}
      up
    {% elif command in ['off', 'move', 'step'] %}
      down
    {% elif command == 'press_1' %}
      left
    {% elif command == 'press_2' %}
      right
    {% else %}
      unknown
    {% endif %}

  # Determine press type
  press_type: >
    {% if command in ['on', 'off'] %}
      single
    {% elif command in ['step_with_on_off', 'step'] %}
      double
    {% elif command in ['move_with_on_off', 'move'] %}
      long
    {% else %}
      single
    {% endif %}

  ###########################################################################
  # ENTITY RESOLUTION — FLAT INPUTS (OPTIONAL)
  ###########################################################################

  # UP
  up_single_entity: !input up_single_entity
  up_double_entity: !input up_double_entity
  up_triple_entity: !input up_triple_entity
  up_quadruple_entity: !input up_quadruple_entity
  up_quintuple_entity: !input up_quintuple_entity
  up_long_entity: !input up_long_entity

  # DOWN
  down_single_entity: !input down_single_entity
  down_double_entity: !input down_double_entity
  down_triple_entity: !input down_triple_entity
  down_quadruple_entity: !input down_quadruple_entity
  down_quintuple_entity: !input down_quintuple_entity
  down_long_entity: !input down_long_entity

  # LEFT
  left_single_entity: !input left_single_entity
  left_double_entity: !input left_double_entity
  left_triple_entity: !input left_triple_entity
  left_quadruple_entity: !input left_quadruple_entity
  left_quintuple_entity: !input left_quintuple_entity
  left_long_entity: !input left_long_entity

  # RIGHT
  right_single_entity: !input right_single_entity
  right_double_entity: !input right_double_entity
  right_triple_entity: !input right_triple_entity
  right_quadruple_entity: !input right_quadruple_entity
  right_quintuple_entity: !input right_quintuple_entity
  right_long_entity: !input right_long_entity

  ###########################################################################
  # RESOLVE THE ENTITY FOR THIS PRESS (OPTIONAL)
  ###########################################################################

  mapped_entity: >
    {% set key = button ~ '_' ~ press_type ~ '_entity' %}
    {% set e = vars()[key] %}
    {% if e in ['', None] %}
      none
    {% else %}
      {{ e }}
    {% endif %}
action:

  ############################################################
  # DEBUG LOGGING
  ############################################################
  - choose:
      - conditions: "{{ debug }}"
        sequence:
          - service: system_log.write
            data:
              message: >
                STYRBAR DEBUG —
                command={{ trigger.event.data.command }},
                args={{ trigger.event.data.args }},
                mapped_entity={{ mapped_entity }},
                last_entity={{ last_entity }},
                last_domain={{ last_domain }}
              level: info

  ############################################################
  # HELPER UPDATE (HU‑A — UPDATE ON EVERY PRESS)
  ############################################################
  - choose:
      - conditions: "{{ mapped_entity != 'none' }}"
        sequence:
          - service: input_text.set_value
            data:
              entity_id: "{{ helper }}"
              value: "{{ mapped_entity }}"
      - conditions: "{{ mapped_entity == 'none' }}"
        sequence:
          - service: input_text.set_value
            data:
              entity_id: "{{ helper }}"
              value: ""

  ############################################################
  # MULTI‑PRESS LOGIC (MP‑1 — ORIGINAL MODEL)
  ############################################################
  - choose:

      #######################################################################
      # LONG PRESS (LEFT/RIGHT ONLY)
      #######################################################################
      - conditions: "{{ trigger.event.data.command == 'release' }}"
        sequence: !input left_long_action

      #######################################################################
      # UP BUTTON (command: "on")
      #######################################################################
      - conditions: "{{ trigger.event.data.command == 'on' }}"
        sequence:
          - wait_for_trigger:
              - event_type: zha_event
                event_data:
                  device_id: !input remote
                  command: "on"
            timeout:
              milliseconds: !input press_timeout
            continue_on_timeout: true

          - choose:
              - conditions: "{{ wait.trigger is none }}"
                sequence: !input up_single_action
              - conditions: "{{ wait.trigger is not none }}"
                sequence:
                  - wait_for_trigger:
                      - event_type: zha_event
                        event_data:
                          device_id: !input remote
                          command: "on"
                    timeout:
                      milliseconds: !input press_timeout
                    continue_on_timeout: true

                  - choose:
                      - conditions: "{{ wait.trigger is none }}"
                        sequence: !input up_double_action
                      - conditions: "{{ wait.trigger is not none }}"
                        sequence:
                          - wait_for_trigger:
                              - event_type: zha_event
                                event_data:
                                  device_id: !input remote
                                  command: "on"
                            timeout:
                              milliseconds: !input press_timeout
                            continue_on_timeout: true

                          - choose:
                              - conditions: "{{ wait.trigger is none }}"
                                sequence: !input up_triple_action
                              - conditions: "{{ wait.trigger is not none }}"
                                sequence:
                                  - wait_for_trigger:
                                      - event_type: zha_event
                                        event_data:
                                          device_id: !input remote
                                          command: "on"
                                    timeout:
                                      milliseconds: !input press_timeout
                                    continue_on_timeout: true

                                  - choose:
                                      - conditions: "{{ wait.trigger is none }}"
                                        sequence: !input up_quadruple_action
                                      - conditions: "{{ wait.trigger is not none }}"
                                        sequence: !input up_quintuple_action

      #######################################################################
      # DOWN BUTTON (command: "off")
      #######################################################################
      - conditions: "{{ trigger.event.data.command == 'off' }}"
        sequence:
          - wait_for_trigger:
              - event_type: zha_event
                event_data:
                  device_id: !input remote
                  command: "off"
            timeout:
              milliseconds: !input press_timeout
            continue_on_timeout: true

          - choose:
              - conditions: "{{ wait.trigger is none }}"
                sequence: !input down_single_action
              - conditions: "{{ wait.trigger is not none }}"
                sequence:
                  - wait_for_trigger:
                      - event_type: zha_event
                        event_data:
                          device_id: !input remote
                          command: "off"
                    timeout:
                      milliseconds: !input press_timeout
                    continue_on_timeout: true

                  - choose:
                      - conditions: "{{ wait.trigger is none }}"
                        sequence: !input down_double_action
                      - conditions: "{{ wait.trigger is not none }}"
                        sequence:
                          - wait_for_trigger:
                              - event_type: zha_event
                                event_data:
                                  device_id: !input remote
                                  command: "off"
                            timeout:
                              milliseconds: !input press_timeout
                            continue_on_timeout: true

                          - choose:
                              - conditions: "{{ wait.trigger is none }}"
                                sequence: !input down_triple_action
                              - conditions: "{{ wait.trigger is not none }}"
                                sequence:
                                  - wait_for_trigger:
                                      - event_type: zha_event
                                        event_data:
                                          device_id: !input remote
                                          command: "off"
                                    timeout:
                                      milliseconds: !input press_timeout
                                    continue_on_timeout: true

                                  - choose:
                                      - conditions: "{{ wait.trigger is none }}"
                                        sequence: !input down_quadruple_action
                                      - conditions: "{{ wait.trigger is not none }}"
                                        sequence: !input down_quintuple_action

      #######################################################################
      # RIGHT BUTTON (args: [256, 13, 0])
      #######################################################################
      - conditions: >
          {{ trigger.event.data.command == 'press'
             and trigger.event.data.args == [256, 13, 0] }}
        sequence:
          - wait_for_trigger:
              - event_type: zha_event
                event_data:
                  device_id: !input remote
                  command: press
                  args: [256, 13, 0]
            timeout:
              milliseconds: !input press_timeout
            continue_on_timeout: true

          - choose:
              - conditions: "{{ wait.trigger is none }}"
                sequence: !input right_single_action
              - conditions: "{{ wait.trigger is not none }}"
                sequence:
                  - wait_for_trigger:
                      - event_type: zha_event
                        event_data:
                          device_id: !input remote
                          command: press
                          args: [256, 13, 0]
                    timeout:
                      milliseconds: !input press_timeout
                    continue_on_timeout: true

                  - choose:
                      - conditions: "{{ wait.trigger is none }}"
                        sequence: !input right_double_action
                      - conditions: "{{ wait.trigger is not none }}"
                        sequence:
                          - wait_for_trigger:
                              - event_type: zha_event
                                event_data:
                                  device_id: !input remote
                                  command: press
                                  args: [256, 13, 0]
                            timeout:
                              milliseconds: !input press_timeout
                            continue_on_timeout: true

                          - choose:
                              - conditions: "{{ wait.trigger is none }}"
                                sequence: !input right_triple_action
                              - conditions: "{{ wait.trigger is not none }}"
                                sequence:
                                  - wait_for_trigger:
                                      - event_type: zha_event
                                        event_data:
                                          device_id: !input remote
                                          command: press
                                          args: [256, 13, 0]
                                    timeout:
                                      milliseconds: !input press_timeout
                                    continue_on_timeout: true

                                  - choose:
                                      - conditions: "{{ wait.trigger is none }}"
                                        sequence: !input right_quadruple_action
                                      - conditions: "{{ wait.trigger is not none }}"
                                        sequence: !input right_quintuple_action

      #######################################################################
      # LEFT BUTTON (args: [257, 13, 0])
      #######################################################################
      - conditions: >
          {{ trigger.event.data.command == 'press'
             and trigger.event.data.args == [257, 13, 0] }}
        sequence:
          - wait_for_trigger:
              - event_type: zha_event
                event_data:
                  device_id: !input remote
                  command: press
                  args: [257, 13, 0]
            timeout:
              milliseconds: !input press_timeout
            continue_on_timeout: true

          - choose:
              - conditions: "{{ wait.trigger is none }}"
                sequence: !input left_single_action
              - conditions: "{{ wait.trigger is not none }}"
                sequence:
                  - wait_for_trigger:
                      - event_type: zha_event
                        event_data:
                          device_id: !input remote
                          command: press
                          args: [257, 13, 0]
                    timeout:
                      milliseconds: !input press_timeout
                    continue_on_timeout: true

                  - choose:
                      - conditions: "{{ wait.trigger is none }}"
                        sequence: !input left_double_action
                      - conditions: "{{ wait.trigger is not none }}"
                        sequence:
                          - wait_for_trigger:
                              - event_type: zha_event
                                event_data:
                                  device_id: !input remote
                                  command: press
                                  args: [257, 13, 0]
                            timeout:
                              milliseconds: !input press_timeout
                            continue_on_timeout: true

                          - choose:
                              - conditions: "{{ wait.trigger is none }}"
                                sequence: !input left_triple_action
                              - conditions: "{{ wait.trigger is not none }}"
                                sequence:
                                  - wait_for_trigger:
                                      - event_type: zha_event
                                        event_data:
                                          device_id: !input remote
                                          command: press
                                          args: [257, 13, 0]
                                    timeout:
                                      milliseconds: !input press_timeout
                                    continue_on_timeout: true

                                  - choose:
                                      - conditions: "{{ wait.trigger is none }}"
                                        sequence: !input left_quadruple_action
                                      - conditions: "{{ wait.trigger is not none }}"
                                        sequence: !input left_quintuple_action

  ############################################################
  # LONG‑PRESS BRIGHTNESS / VOLUME / FLEX‑A DOMAIN LOGIC
  ############################################################
  - choose:

      #######################################################################
      # UP LONG‑PRESS — INCREASE
      #######################################################################
      - conditions: >
          {{ trigger.event.data.command == 'move_with_on_off'
             or trigger.event.data.command == 'move' }}
        sequence:
          - repeat:
              until: "{{ trigger.event.data.command == 'stop' }}"
              sequence:

                - choose:

                    # LIGHT
                    - conditions: "{{ last_domain == 'light' }}"
                      sequence:
                        - service: light.turn_on
                          data:
                            entity_id: "{{ last_entity }}"
                            brightness_step_pct: "{{ brightness_step }}"

                    # MEDIA PLAYER
                    - conditions: "{{ last_domain == 'media_player' }}"
                      sequence:
                        - service: media_player.volume_set
                          data:
                            entity_id: "{{ last_entity }}"
                            volume_level: >
                              {{
                                [
                                  (state_attr(last_entity, 'volume_level') | float(0)) + volume_step,
                                  1
                                ] | min
                              }}

                    # FAN
                    - conditions: "{{ last_domain == 'fan' }}"
                      sequence:
                        - service: fan.set_percentage
                          data:
                            entity_id: "{{ last_entity }}"
                            percentage: >
                              {{
                                [
                                  (state_attr(last_entity, 'percentage') | float(0)) + brightness_step,
                                  100
                                ] | min
                              }}

                    # CLIMATE
                    - conditions: "{{ last_domain == 'climate' }}"
                      sequence:
                        - service: climate.set_temperature
                          data:
                            entity_id: "{{ last_entity }}"
                            temperature: >
                              {{
                                (state_attr(last_entity, 'temperature') | float(20)) + volume_step
                              }}

                    # COVER
                    - conditions: "{{ last_domain == 'cover' }}"
                      sequence:
                        - service: cover.open_cover
                          data:
                            entity_id: "{{ last_entity }}"

                    # SWITCH
                    - conditions: "{{ last_domain == 'switch' }}"
                      sequence:
                        - service: switch.turn_on
                          data:
                            entity_id: "{{ last_entity }}"

                - delay:
                    milliseconds: "{{ hold_repeat_interval }}"

      #######################################################################
      # DOWN LONG‑PRESS — DECREASE
      #######################################################################
      - conditions: >
          {{ trigger.event.data.command == 'move'
             or trigger.event.data.command == 'move_with_on_off' }}
        sequence:
          - repeat:
              until: "{{ trigger.event.data.command == 'stop' }}"
              sequence:

                - choose:

                    # LIGHT
                    - conditions: "{{ last_domain == 'light' }}"
                      sequence:
                        - service: light.turn_on
                          data:
                            entity_id: "{{ last_entity }}"
                            brightness_step_pct: "-{{ brightness_step }}"

                    # MEDIA PLAYER
                    - conditions: "{{ last_domain == 'media_player' }}"
                      sequence:
                        - service: media_player.volume_set
                          data:
                            entity_id: "{{ last_entity }}"
                            volume_level: >
                              {{
                                [
                                  (state_attr(last_entity, 'volume_level') | float(0)) - volume_step,
                                  0
                                ] | max
                              }}

                    # FAN
                    - conditions: "{{ last_domain == 'fan' }}"
                      sequence:
                        - service: fan.set_percentage
                          data:
                            entity_id: "{{ last_entity }}"
                            percentage: >
                              {{
                                [
                                  (state_attr(last_entity, 'percentage') | float(0)) - brightness_step,
                                  0
                                ] | max
                              }}

                    # CLIMATE
                    - conditions: "{{ last_domain == 'climate' }}"
                      sequence:
                        - service: climate.set_temperature
                          data:
                            entity_id: "{{ last_entity }}"
                            temperature: >
                              {{
                                (state_attr(last_entity, 'temperature') | float(20)) - volume_step
                              }}

                    # COVER
                    - conditions: "{{ last_domain == 'cover' }}"
                      sequence:
                        - service: cover.close_cover
                          data:
                            entity_id: "{{ last_entity }}"

                    # SWITCH
                    - conditions: "{{ last_domain == 'switch' }}"
                      sequence:
                        - service: switch.turn_off
                          data:
                            entity_id: "{{ last_entity }}"

                - delay:
                    milliseconds: "{{ hold_repeat_interval }}"
