blueprint:
  name: "ZHA - IKEA Styrbar N2 (4-Button) — Multipress 1–3 + UP/DOWN Long-Press Repeat"
  description: >
    Styrbar N2 blueprint with reliable multi-press (1–3) on all four buttons
    and UP/DOWN long-press brightness/volume/fan/climate/cover repeat.

    The long-press target entity is automatically extracted from whichever
    action was last fired — no separate entity inputs needed. Just configure
    the actions and the blueprint handles the rest.

    Requires one input_text helper (any max length >= 50).

  domain: automation

  input:

    remote:
      name: Styrbar Remote (ZHA)
      selector:
        device:
          integration: zha
          manufacturer: "IKEA of Sweden"
          model: "Remote Control N2"

    last_action_helper:
      name: Last Action Helper (input_text)
      description: >
        Stores the entity last used by a short press so UP/DOWN long-press
        knows what to control. Create an input_text helper with max length >= 50.
      selector:
        entity:
          domain: input_text

    press_timeout:
      name: Multi-press timeout (ms)
      default: 500
      selector:
        number:
          min: 100
          max: 2000
          step: 100
          unit_of_measurement: milliseconds
          mode: slider

    hold_repeat_interval:
      name: Long-press repeat interval (ms)
      default: 300
      selector:
        number:
          min: 100
          max: 1000
          step: 50
          unit_of_measurement: ms

    brightness_step:
      name: Brightness / fan step (%)
      default: 10
      selector:
        number:
          min: 1
          max: 50
          step: 1

    volume_step:
      name: Volume / climate step
      default: 0.05
      selector:
        number:
          min: 0.01
          max: 0.20
          step: 0.01

    debug_mode:
      name: Enable debug logging
      default: false
      selector:
        boolean: {}

    ############################################################
    # ACTION INPUTS — entity is extracted from these automatically
    ############################################################

    up_single_action:
      name: UP - Single Press
      selector: { action: {} }
      default: []

    up_double_action:
      name: UP - Double Press
      selector: { action: {} }
      default: []

    up_triple_action:
      name: UP - Triple Press
      selector: { action: {} }
      default: []

    down_single_action:
      name: DOWN - Single Press
      selector: { action: {} }
      default: []

    down_double_action:
      name: DOWN - Double Press
      selector: { action: {} }
      default: []

    down_triple_action:
      name: DOWN - Triple Press
      selector: { action: {} }
      default: []

    left_single_action:
      name: LEFT - Single Press
      selector: { action: {} }
      default: []

    left_double_action:
      name: LEFT - Double Press
      selector: { action: {} }
      default: []

    left_triple_action:
      name: LEFT - Triple Press
      selector: { action: {} }
      default: []

    right_single_action:
      name: RIGHT - Single Press
      selector: { action: {} }
      default: []

    right_double_action:
      name: RIGHT - Double Press
      selector: { action: {} }
      default: []

    right_triple_action:
      name: RIGHT - Triple Press
      selector: { action: {} }
      default: []

mode: queued
max_exceeded: silent

trigger:
  - trigger: event
    event_type: zha_event
    event_data:
      device_id: !input remote

conditions:
  - condition: template
    value_template: >
      {{ trigger.event.data.command in ['on', 'off', 'press', 'release',
         'move_with_on_off', 'move', 'stop_with_on_off', 'stop'] }}

variables:
  helper: !input last_action_helper
  brightness_step: !input brightness_step
  volume_step: !input volume_step
  hold_repeat_interval: !input hold_repeat_interval
  debug: !input debug_mode

  command: "{{ trigger.event.data.command }}"
  cluster_id: "{{ trigger.event.data.cluster_id | default(-1) | int }}"

  # Resolved action lists — needed so we can inspect them for entity extraction
  up_single_action:    !input up_single_action
  up_double_action:    !input up_double_action
  up_triple_action:    !input up_triple_action
  down_single_action:  !input down_single_action
  down_double_action:  !input down_double_action
  down_triple_action:  !input down_triple_action
  left_single_action:  !input left_single_action
  left_double_action:  !input left_double_action
  left_triple_action:  !input left_triple_action
  right_single_action: !input right_single_action
  right_double_action: !input right_double_action
  right_triple_action: !input right_triple_action

  # Last entity stored in helper (for long-press targeting)
  last_entity: "{{ states(helper) }}"
  last_domain: >
    {% if last_entity and '.' in last_entity %}
      {{ last_entity.split('.')[0] }}
    {% else %}
      none
    {% endif %}

actions:

  ############################################################
  # DEBUG LOGGING
  ############################################################
  - if: "{{ debug }}"
    then:
      - service: system_log.write
        data:
          message: >
            STYRBAR DEBUG — command={{ command }}, cluster_id={{ cluster_id }},
            last_entity={{ last_entity }}, last_domain={{ last_domain }}
          level: info

  - choose:

      ##################################################################
      # UP BUTTON (command: "on")
      ##################################################################
      - conditions:
          - condition: template
            value_template: "{{ command == 'on' }}"
        sequence:
          - wait_for_trigger:
              - trigger: event
                event_type: zha_event
                event_data:
                  device_id: !input remote
                  command: "on"
            timeout:
              milliseconds: !input press_timeout
            continue_on_timeout: true

          - if:
              - condition: template
                value_template: "{{ wait.trigger is none }}"
            then:
              # SINGLE — fire action then update helper from it
              - sequence: !input up_single_action
              - variables:
                  _action: "{{ up_single_action }}"
                  _entity: >
                    {% set a = _action %}
                    {% if a | length > 0 %}
                      {% set first = a[0] %}
                      {% if first.target is defined and first.target.entity_id is defined %}
                        {{ first.target.entity_id }}
                      {% elif first.data is defined and first.data.entity_id is defined %}
                        {{ first.data.entity_id }}
                      {% else %}
                        {{ last_entity }}
                      {% endif %}
                    {% else %}
                      {{ last_entity }}
                    {% endif %}
              - if: "{{ _entity not in ['', None, 'none'] }}"
                then:
                  - service: input_text.set_value
                    data:
                      entity_id: "{{ helper }}"
                      value: "{{ _entity }}"
            else:
              sequence:
                - wait_for_trigger:
                    - trigger: event
                      event_type: zha_event
                      event_data:
                        device_id: !input remote
                        command: "on"
                  timeout:
                    milliseconds: !input press_timeout
                  continue_on_timeout: true

                - if:
                    - condition: template
                      value_template: "{{ wait.trigger is none }}"
                  then:
                    # DOUBLE
                    - sequence: !input up_double_action
                    - variables:
                        _action: "{{ up_double_action }}"
                        _entity: >
                          {% set a = _action %}
                          {% if a | length > 0 %}
                            {% set first = a[0] %}
                            {% if first.target is defined and first.target.entity_id is defined %}
                              {{ first.target.entity_id }}
                            {% elif first.data is defined and first.data.entity_id is defined %}
                              {{ first.data.entity_id }}
                            {% else %}
                              {{ last_entity }}
                            {% endif %}
                          {% else %}
                            {{ last_entity }}
                          {% endif %}
                    - if: "{{ _entity not in ['', None, 'none'] }}"
                      then:
                        - service: input_text.set_value
                          data:
                            entity_id: "{{ helper }}"
                            value: "{{ _entity }}"
                  else:
                    # TRIPLE
                    - sequence: !input up_triple_action
                    - variables:
                        _action: "{{ up_triple_action }}"
                        _entity: >
                          {% set a = _action %}
                          {% if a | length > 0 %}
                            {% set first = a[0] %}
                            {% if first.target is defined and first.target.entity_id is defined %}
                              {{ first.target.entity_id }}
                            {% elif first.data is defined and first.data.entity_id is defined %}
                              {{ first.data.entity_id }}
                            {% else %}
                              {{ last_entity }}
                            {% endif %}
                          {% else %}
                            {{ last_entity }}
                          {% endif %}
                    - if: "{{ _entity not in ['', None, 'none'] }}"
                      then:
                        - service: input_text.set_value
                          data:
                            entity_id: "{{ helper }}"
                            value: "{{ _entity }}"

      ##################################################################
      # DOWN BUTTON (command: "off")
      ##################################################################
      - conditions:
          - condition: template
            value_template: "{{ command == 'off' }}"
        sequence:
          - wait_for_trigger:
              - trigger: event
                event_type: zha_event
                event_data:
                  device_id: !input remote
                  command: "off"
            timeout:
              milliseconds: !input press_timeout
            continue_on_timeout: true

          - if:
              - condition: template
                value_template: "{{ wait.trigger is none }}"
            then:
              - sequence: !input down_single_action
              - variables:
                  _action: "{{ down_single_action }}"
                  _entity: >
                    {% set a = _action %}
                    {% if a | length > 0 %}
                      {% set first = a[0] %}
                      {% if first.target is defined and first.target.entity_id is defined %}
                        {{ first.target.entity_id }}
                      {% elif first.data is defined and first.data.entity_id is defined %}
                        {{ first.data.entity_id }}
                      {% else %}
                        {{ last_entity }}
                      {% endif %}
                    {% else %}
                      {{ last_entity }}
                    {% endif %}
              - if: "{{ _entity not in ['', None, 'none'] }}"
                then:
                  - service: input_text.set_value
                    data:
                      entity_id: "{{ helper }}"
                      value: "{{ _entity }}"
            else:
              sequence:
                - wait_for_trigger:
                    - trigger: event
                      event_type: zha_event
                      event_data:
                        device_id: !input remote
                        command: "off"
                  timeout:
                    milliseconds: !input press_timeout
                  continue_on_timeout: true

                - if:
                    - condition: template
                      value_template: "{{ wait.trigger is none }}"
                  then:
                    - sequence: !input down_double_action
                    - variables:
                        _action: "{{ down_double_action }}"
                        _entity: >
                          {% set a = _action %}
                          {% if a | length > 0 %}
                            {% set first = a[0] %}
                            {% if first.target is defined and first.target.entity_id is defined %}
                              {{ first.target.entity_id }}
                            {% elif first.data is defined and first.data.entity_id is defined %}
                              {{ first.data.entity_id }}
                            {% else %}
                              {{ last_entity }}
                            {% endif %}
                          {% else %}
                            {{ last_entity }}
                          {% endif %}
                    - if: "{{ _entity not in ['', None, 'none'] }}"
                      then:
                        - service: input_text.set_value
                          data:
                            entity_id: "{{ helper }}"
                            value: "{{ _entity }}"
                  else:
                    - sequence: !input down_triple_action
                    - variables:
                        _action: "{{ down_triple_action }}"
                        _entity: >
                          {% set a = _action %}
                          {% if a | length > 0 %}
                            {% set first = a[0] %}
                            {% if first.target is defined and first.target.entity_id is defined %}
                              {{ first.target.entity_id }}
                            {% elif first.data is defined and first.data.entity_id is defined %}
                              {{ first.data.entity_id }}
                            {% else %}
                              {{ last_entity }}
                            {% endif %}
                          {% else %}
                            {{ last_entity }}
                          {% endif %}
                    - if: "{{ _entity not in ['', None, 'none'] }}"
                      then:
                        - service: input_text.set_value
                          data:
                            entity_id: "{{ helper }}"
                            value: "{{ _entity }}"

      ##################################################################
      # RIGHT BUTTON (args [256, 13, 0])
      ##################################################################
      - conditions:
          - condition: template
            value_template: "{{ command == 'press' and trigger.event.data.args == [256, 13, 0] }}"
        sequence:
          - wait_for_trigger:
              - trigger: event
                event_type: zha_event
                event_data:
                  device_id: !input remote
                  command: press
                  args: [256, 13, 0]
            timeout:
              milliseconds: !input press_timeout
            continue_on_timeout: true

          - if:
              - condition: template
                value_template: "{{ wait.trigger is none }}"
            then:
              - sequence: !input right_single_action
              - variables:
                  _action: "{{ right_single_action }}"
                  _entity: >
                    {% set a = _action %}
                    {% if a | length > 0 %}
                      {% set first = a[0] %}
                      {% if first.target is defined and first.target.entity_id is defined %}
                        {{ first.target.entity_id }}
                      {% elif first.data is defined and first.data.entity_id is defined %}
                        {{ first.data.entity_id }}
                      {% else %}
                        {{ last_entity }}
                      {% endif %}
                    {% else %}
                      {{ last_entity }}
                    {% endif %}
              - if: "{{ _entity not in ['', None, 'none'] }}"
                then:
                  - service: input_text.set_value
                    data:
                      entity_id: "{{ helper }}"
                      value: "{{ _entity }}"
            else:
              sequence:
                - wait_for_trigger:
                    - trigger: event
                      event_type: zha_event
                      event_data:
                        device_id: !input remote
                        command: press
                        args: [256, 13, 0]
                  timeout:
                    milliseconds: !input press_timeout
                  continue_on_timeout: true

                - if:
                    - condition: template
                      value_template: "{{ wait.trigger is none }}"
                  then:
                    - sequence: !input right_double_action
                    - variables:
                        _action: "{{ right_double_action }}"
                        _entity: >
                          {% set a = _action %}
                          {% if a | length > 0 %}
                            {% set first = a[0] %}
                            {% if first.target is defined and first.target.entity_id is defined %}
                              {{ first.target.entity_id }}
                            {% elif first.data is defined and first.data.entity_id is defined %}
                              {{ first.data.entity_id }}
                            {% else %}
                              {{ last_entity }}
                            {% endif %}
                          {% else %}
                            {{ last_entity }}
                          {% endif %}
                    - if: "{{ _entity not in ['', None, 'none'] }}"
                      then:
                        - service: input_text.set_value
                          data:
                            entity_id: "{{ helper }}"
                            value: "{{ _entity }}"
                  else:
                    - sequence: !input right_triple_action
                    - variables:
                        _action: "{{ right_triple_action }}"
                        _entity: >
                          {% set a = _action %}
                          {% if a | length > 0 %}
                            {% set first = a[0] %}
                            {% if first.target is defined and first.target.entity_id is defined %}
                              {{ first.target.entity_id }}
                            {% elif first.data is defined and first.data.entity_id is defined %}
                              {{ first.data.entity_id }}
                            {% else %}
                              {{ last_entity }}
                            {% endif %}
                          {% else %}
                            {{ last_entity }}
                          {% endif %}
                    - if: "{{ _entity not in ['', None, 'none'] }}"
                      then:
                        - service: input_text.set_value
                          data:
                            entity_id: "{{ helper }}"
                            value: "{{ _entity }}"

      ##################################################################
      # LEFT BUTTON (args [257, 13, 0])
      ##################################################################
      - conditions:
          - condition: template
            value_template: "{{ command == 'press' and trigger.event.data.args == [257, 13, 0] }}"
        sequence:
          - wait_for_trigger:
              - trigger: event
                event_type: zha_event
                event_data:
                  device_id: !input remote
                  command: press
                  args: [257, 13, 0]
            timeout:
              milliseconds: !input press_timeout
            continue_on_timeout: true

          - if:
              - condition: template
                value_template: "{{ wait.trigger is none }}"
            then:
              - sequence: !input left_single_action
              - variables:
                  _action: "{{ left_single_action }}"
                  _entity: >
                    {% set a = _action %}
                    {% if a | length > 0 %}
                      {% set first = a[0] %}
                      {% if first.target is defined and first.target.entity_id is defined %}
                        {{ first.target.entity_id }}
                      {% elif first.data is defined and first.data.entity_id is defined %}
                        {{ first.data.entity_id }}
                      {% else %}
                        {{ last_entity }}
                      {% endif %}
                    {% else %}
                      {{ last_entity }}
                    {% endif %}
              - if: "{{ _entity not in ['', None, 'none'] }}"
                then:
                  - service: input_text.set_value
                    data:
                      entity_id: "{{ helper }}"
                      value: "{{ _entity }}"
            else:
              sequence:
                - wait_for_trigger:
                    - trigger: event
                      event_type: zha_event
                      event_data:
                        device_id: !input remote
                        command: press
                        args: [257, 13, 0]
                  timeout:
                    milliseconds: !input press_timeout
                  continue_on_timeout: true

                - if:
                    - condition: template
                      value_template: "{{ wait.trigger is none }}"
                  then:
                    - sequence: !input left_double_action
                    - variables:
                        _action: "{{ left_double_action }}"
                        _entity: >
                          {% set a = _action %}
                          {% if a | length > 0 %}
                            {% set first = a[0] %}
                            {% if first.target is defined and first.target.entity_id is defined %}
                              {{ first.target.entity_id }}
                            {% elif first.data is defined and first.data.entity_id is defined %}
                              {{ first.data.entity_id }}
                            {% else %}
                              {{ last_entity }}
                            {% endif %}
                          {% else %}
                            {{ last_entity }}
                          {% endif %}
                    - if: "{{ _entity not in ['', None, 'none'] }}"
                      then:
                        - service: input_text.set_value
                          data:
                            entity_id: "{{ helper }}"
                            value: "{{ _entity }}"
                  else:
                    - sequence: !input left_triple_action
                    - variables:
                        _action: "{{ left_triple_action }}"
                        _entity: >
                          {% set a = _action %}
                          {% if a | length > 0 %}
                            {% set first = a[0] %}
                            {% if first.target is defined and first.target.entity_id is defined %}
                              {{ first.target.entity_id }}
                            {% elif first.data is defined and first.data.entity_id is defined %}
                              {{ first.data.entity_id }}
                            {% else %}
                              {{ last_entity }}
                            {% endif %}
                          {% else %}
                            {{ last_entity }}
                          {% endif %}
                    - if: "{{ _entity not in ['', None, 'none'] }}"
                      then:
                        - service: input_text.set_value
                          data:
                            entity_id: "{{ helper }}"
                            value: "{{ _entity }}"

      ##################################################################
      # UP LONG-PRESS (cluster 8, move_with_on_off)
      #
      # The stop event (stop/stop_with_on_off) cannot be caught by
      # wait_for_trigger inside the loop when mode: single is active,
      # because mode: single drops new automation triggers — but
      # wait_for_trigger listens to events independently of the
      # automation trigger, so it DOES still receive them.
      # The repeat count limit (100) is a safety net only — in normal
      # use the stop event will always exit the loop first.
      ##################################################################
      - conditions:
          - condition: template
            value_template: "{{ cluster_id == 8 and command == 'move_with_on_off' }}"
        sequence:
          - repeat:
              sequence:
                - choose:
                    - conditions: "{{ last_domain == 'light' }}"
                      sequence:
                        - service: light.turn_on
                          data:
                            entity_id: "{{ last_entity }}"
                            brightness_step_pct: "{{ brightness_step | int }}"

                    - conditions: "{{ last_domain == 'media_player' }}"
                      sequence:
                        - service: media_player.volume_set
                          data:
                            entity_id: "{{ last_entity }}"
                            volume_level: >
                              {{ [ (state_attr(last_entity, 'volume_level') | float(0)) + (volume_step | float), 1.0 ] | min }}

                    - conditions: "{{ last_domain == 'fan' }}"
                      sequence:
                        - service: fan.set_percentage
                          data:
                            entity_id: "{{ last_entity }}"
                            percentage: >
                              {{ [ (state_attr(last_entity, 'percentage') | float(0)) + (brightness_step | int), 100 ] | min }}

                    - conditions: "{{ last_domain == 'climate' }}"
                      sequence:
                        - service: climate.set_temperature
                          data:
                            entity_id: "{{ last_entity }}"
                            temperature: >
                              {{ (state_attr(last_entity, 'temperature') | float(20)) + (volume_step | float) }}

                    - conditions: "{{ last_domain == 'cover' }}"
                      sequence:
                        - service: cover.open_cover
                          data:
                            entity_id: "{{ last_entity }}"

                    - conditions: "{{ last_domain == 'switch' }}"
                      sequence:
                        - service: switch.turn_on
                          data:
                            entity_id: "{{ last_entity }}"

                - wait_for_trigger:
                    - trigger: event
                      event_type: zha_event
                      event_data:
                        device_id: !input remote
                        command: stop_with_on_off
                    - trigger: event
                      event_type: zha_event
                      event_data:
                        device_id: !input remote
                        command: stop
                  timeout:
                    milliseconds: !input hold_repeat_interval
                  continue_on_timeout: true

              until:
                # Exit when stop event received OR after 100 repeats as safety net
                - condition: template
                  value_template: "{{ wait.trigger is not none or repeat.index >= 100 }}"

      ##################################################################
      # DOWN LONG-PRESS (cluster 8, move)
      ##################################################################
      - conditions:
          - condition: template
            value_template: "{{ cluster_id == 8 and command == 'move' }}"
        sequence:
          - repeat:
              sequence:
                - choose:
                    - conditions: "{{ last_domain == 'light' }}"
                      sequence:
                        - service: light.turn_on
                          data:
                            entity_id: "{{ last_entity }}"
                            brightness_step_pct: "{{ (brightness_step | int) * -1 }}"

                    - conditions: "{{ last_domain == 'media_player' }}"
                      sequence:
                        - service: media_player.volume_set
                          data:
                            entity_id: "{{ last_entity }}"
                            volume_level: >
                              {{ [ (state_attr(last_entity, 'volume_level') | float(0)) - (volume_step | float), 0.0 ] | max }}

                    - conditions: "{{ last_domain == 'fan' }}"
                      sequence:
                        - service: fan.set_percentage
                          data:
                            entity_id: "{{ last_entity }}"
                            percentage: >
                              {{ [ (state_attr(last_entity, 'percentage') | float(0)) - (brightness_step | int), 0 ] | max }}

                    - conditions: "{{ last_domain == 'climate' }}"
                      sequence:
                        - service: climate.set_temperature
                          data:
                            entity_id: "{{ last_entity }}"
                            temperature: >
                              {{ (state_attr(last_entity, 'temperature') | float(20)) - (volume_step | float) }}

                    - conditions: "{{ last_domain == 'cover' }}"
                      sequence:
                        - service: cover.close_cover
                          data:
                            entity_id: "{{ last_entity }}"

                    - conditions: "{{ last_domain == 'switch' }}"
                      sequence:
                        - service: switch.turn_off
                          data:
                            entity_id: "{{ last_entity }}"

                - wait_for_trigger:
                    - trigger: event
                      event_type: zha_event
                      event_data:
                        device_id: !input remote
                        command: stop_with_on_off
                    - trigger: event
                      event_type: zha_event
                      event_data:
                        device_id: !input remote
                        command: stop
                  timeout:
                    milliseconds: !input hold_repeat_interval
                  continue_on_timeout: true

              until:
                # Exit when stop event received OR after 100 repeats as safety net
                - condition: template
                  value_template: "{{ wait.trigger is not none or repeat.index >= 100 }}"
