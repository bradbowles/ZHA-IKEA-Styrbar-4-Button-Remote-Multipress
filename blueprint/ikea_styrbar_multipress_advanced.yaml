blueprint:
  name: "ZHA - IKEA Styrbar N2 (4-Button) — Multipress 1–3 + UP/DOWN Long-Press Repeat"
  description: >
    Styrbar N2 blueprint using the proven mode: single + wait_for_trigger
    multi-press pattern. Supports 1–3 presses on all four buttons, UP/DOWN
    long-press brightness/volume repeat, optional entity mapping via
    input_text helper, and debug logging.

  domain: automation

  input:

    remote:
      name: Styrbar Remote (ZHA)
      selector:
        device:
          integration: zha
          manufacturer: "IKEA of Sweden"
          model: "Remote Control N2"

    last_action_helper:
      name: Last Action Helper (input_text)
      description: Stores the last entity used so long-press UP/DOWN knows what to control.
      selector:
        entity:
          domain: input_text

    press_timeout:
      name: Multi-press timeout (ms)
      default: 500
      selector:
        number:
          min: 100
          max: 2000
          step: 100
          unit_of_measurement: milliseconds
          mode: slider

    hold_repeat_interval:
      name: Long-press repeat interval (ms)
      default: 300
      selector:
        number:
          min: 100
          max: 1000
          step: 50
          unit_of_measurement: ms

    brightness_step:
      name: Brightness step (%)
      default: 10
      selector:
        number:
          min: 1
          max: 50
          step: 1

    volume_step:
      name: Volume step (0.01-0.20)
      default: 0.05
      selector:
        number:
          min: 0.01
          max: 0.20
          step: 0.01

    debug_mode:
      name: Enable debug logging
      default: false
      selector:
        boolean: {}

    ############################################################
    # ENTITY INPUTS
    ############################################################

    up_single_entity:
      name: UP - Single Press Entity
      selector: { entity: {} }
      default: ""

    up_double_entity:
      name: UP - Double Press Entity
      selector: { entity: {} }
      default: ""

    up_triple_entity:
      name: UP - Triple Press Entity
      selector: { entity: {} }
      default: ""

    down_single_entity:
      name: DOWN - Single Press Entity
      selector: { entity: {} }
      default: ""

    down_double_entity:
      name: DOWN - Double Press Entity
      selector: { entity: {} }
      default: ""

    down_triple_entity:
      name: DOWN - Triple Press Entity
      selector: { entity: {} }
      default: ""

    left_single_entity:
      name: LEFT - Single Press Entity
      selector: { entity: {} }
      default: ""

    left_double_entity:
      name: LEFT - Double Press Entity
      selector: { entity: {} }
      default: ""

    left_triple_entity:
      name: LEFT - Triple Press Entity
      selector: { entity: {} }
      default: ""

    right_single_entity:
      name: RIGHT - Single Press Entity
      selector: { entity: {} }
      default: ""

    right_double_entity:
      name: RIGHT - Double Press Entity
      selector: { entity: {} }
      default: ""

    right_triple_entity:
      name: RIGHT - Triple Press Entity
      selector: { entity: {} }
      default: ""

    ############################################################
    # ACTION INPUTS
    ############################################################

    up_single_action:
      name: UP - Single Press Action
      selector: { action: {} }
      default: []

    up_double_action:
      name: UP - Double Press Action
      selector: { action: {} }
      default: []

    up_triple_action:
      name: UP - Triple Press Action
      selector: { action: {} }
      default: []

    down_single_action:
      name: DOWN - Single Press Action
      selector: { action: {} }
      default: []

    down_double_action:
      name: DOWN - Double Press Action
      selector: { action: {} }
      default: []

    down_triple_action:
      name: DOWN - Triple Press Action
      selector: { action: {} }
      default: []

    left_single_action:
      name: LEFT - Single Press Action
      selector: { action: {} }
      default: []

    left_double_action:
      name: LEFT - Double Press Action
      selector: { action: {} }
      default: []

    left_triple_action:
      name: LEFT - Triple Press Action
      selector: { action: {} }
      default: []

    right_single_action:
      name: RIGHT - Single Press Action
      selector: { action: {} }
      default: []

    right_double_action:
      name: RIGHT - Double Press Action
      selector: { action: {} }
      default: []

    right_triple_action:
      name: RIGHT - Triple Press Action
      selector: { action: {} }
      default: []

# mode: single is the key to multi-press working correctly.
# The first run's wait_for_trigger catches the ZHA event directly,
# even though the automation-level trigger is suppressed for the
# second press. mode: restart would kill the waiting run.
mode: single
max_exceeded: silent

trigger:
  - trigger: event
    event_type: zha_event
    event_data:
      device_id: !input remote

# Only handle the commands we care about — ignore move/stop noise
# unless it is a long-press cluster 8 event
conditions:
  - condition: template
    value_template: >
      {{ trigger.event.data.command in ['on', 'off', 'press', 'release',
         'move_with_on_off', 'move', 'stop_with_on_off', 'stop'] }}

variables:
  helper: !input last_action_helper
  brightness_step: !input brightness_step
  volume_step: !input volume_step
  hold_repeat_interval: !input hold_repeat_interval
  debug: !input debug_mode

  command: "{{ trigger.event.data.command }}"
  cluster_id: "{{ trigger.event.data.cluster_id | default(-1) | int }}"
  args: "{{ trigger.event.data.args | default([]) | list }}"

  # Entity inputs resolved for dict lookup
  up_single_entity:    !input up_single_entity
  up_double_entity:    !input up_double_entity
  up_triple_entity:    !input up_triple_entity
  down_single_entity:  !input down_single_entity
  down_double_entity:  !input down_double_entity
  down_triple_entity:  !input down_triple_entity
  left_single_entity:  !input left_single_entity
  left_double_entity:  !input left_double_entity
  left_triple_entity:  !input left_triple_entity
  right_single_entity: !input right_single_entity
  right_double_entity: !input right_double_entity
  right_triple_entity: !input right_triple_entity

  # Last entity stored in helper (for long-press targeting)
  last_entity: "{{ states(helper) }}"
  last_domain: >
    {% if last_entity and '.' in last_entity %}
      {{ last_entity.split('.')[0] }}
    {% else %}
      none
    {% endif %}

actions:

  ############################################################
  # DEBUG LOGGING
  ############################################################
  - if: "{{ debug }}"
    then:
      - service: system_log.write
        data:
          message: >
            STYRBAR DEBUG — command={{ command }}, cluster_id={{ cluster_id }},
            args={{ args }}, last_entity={{ last_entity }}, last_domain={{ last_domain }}
          level: info

  - choose:

      ##################################################################
      # UP BUTTON — short press (cluster 6, command "on")
      ##################################################################
      - conditions:
          - condition: template
            value_template: "{{ command == 'on' }}"
        sequence:

          # Update helper with single-press entity if configured
          - if: "{{ up_single_entity not in ['', None] }}"
            then:
              - service: input_text.set_value
                data:
                  entity_id: "{{ helper }}"
                  value: "{{ up_single_entity }}"

          - wait_for_trigger:
              - trigger: event
                event_type: zha_event
                event_data:
                  device_id: !input remote
                  command: "on"
            timeout:
              milliseconds: !input press_timeout
            continue_on_timeout: true

          - if:
              - condition: template
                value_template: "{{ wait.trigger is none }}"
            then:
              # SINGLE
              sequence: !input up_single_action
            else:
              # 2+ presses — update helper to double entity if configured
              sequence:
                - if: "{{ up_double_entity not in ['', None] }}"
                  then:
                    - service: input_text.set_value
                      data:
                        entity_id: "{{ helper }}"
                        value: "{{ up_double_entity }}"

                - wait_for_trigger:
                    - trigger: event
                      event_type: zha_event
                      event_data:
                        device_id: !input remote
                        command: "on"
                  timeout:
                    milliseconds: !input press_timeout
                  continue_on_timeout: true

                - if:
                    - condition: template
                      value_template: "{{ wait.trigger is none }}"
                  then:
                    # DOUBLE
                    sequence: !input up_double_action
                  else:
                    # TRIPLE
                    sequence:
                      - if: "{{ up_triple_entity not in ['', None] }}"
                        then:
                          - service: input_text.set_value
                            data:
                              entity_id: "{{ helper }}"
                              value: "{{ up_triple_entity }}"
                      - sequence: !input up_triple_action

      ##################################################################
      # DOWN BUTTON — short press (cluster 6, command "off")
      ##################################################################
      - conditions:
          - condition: template
            value_template: "{{ command == 'off' }}"
        sequence:

          - if: "{{ down_single_entity not in ['', None] }}"
            then:
              - service: input_text.set_value
                data:
                  entity_id: "{{ helper }}"
                  value: "{{ down_single_entity }}"

          - wait_for_trigger:
              - trigger: event
                event_type: zha_event
                event_data:
                  device_id: !input remote
                  command: "off"
            timeout:
              milliseconds: !input press_timeout
            continue_on_timeout: true

          - if:
              - condition: template
                value_template: "{{ wait.trigger is none }}"
            then:
              sequence: !input down_single_action
            else:
              sequence:
                - if: "{{ down_double_entity not in ['', None] }}"
                  then:
                    - service: input_text.set_value
                      data:
                        entity_id: "{{ helper }}"
                        value: "{{ down_double_entity }}"

                - wait_for_trigger:
                    - trigger: event
                      event_type: zha_event
                      event_data:
                        device_id: !input remote
                        command: "off"
                  timeout:
                    milliseconds: !input press_timeout
                  continue_on_timeout: true

                - if:
                    - condition: template
                      value_template: "{{ wait.trigger is none }}"
                  then:
                    sequence: !input down_double_action
                  else:
                    sequence:
                      - if: "{{ down_triple_entity not in ['', None] }}"
                        then:
                          - service: input_text.set_value
                            data:
                              entity_id: "{{ helper }}"
                              value: "{{ down_triple_entity }}"
                      - sequence: !input down_triple_action

      ##################################################################
      # RIGHT BUTTON (cluster 5, args [256, 13, 0])
      ##################################################################
      - conditions:
          - condition: template
            value_template: "{{ command == 'press' and trigger.event.data.args == [256, 13, 0] }}"
        sequence:

          - if: "{{ right_single_entity not in ['', None] }}"
            then:
              - service: input_text.set_value
                data:
                  entity_id: "{{ helper }}"
                  value: "{{ right_single_entity }}"

          - wait_for_trigger:
              - trigger: event
                event_type: zha_event
                event_data:
                  device_id: !input remote
                  command: press
                  args: [256, 13, 0]
            timeout:
              milliseconds: !input press_timeout
            continue_on_timeout: true

          - if:
              - condition: template
                value_template: "{{ wait.trigger is none }}"
            then:
              sequence: !input right_single_action
            else:
              sequence:
                - if: "{{ right_double_entity not in ['', None] }}"
                  then:
                    - service: input_text.set_value
                      data:
                        entity_id: "{{ helper }}"
                        value: "{{ right_double_entity }}"

                - wait_for_trigger:
                    - trigger: event
                      event_type: zha_event
                      event_data:
                        device_id: !input remote
                        command: press
                        args: [256, 13, 0]
                  timeout:
                    milliseconds: !input press_timeout
                  continue_on_timeout: true

                - if:
                    - condition: template
                      value_template: "{{ wait.trigger is none }}"
                  then:
                    sequence: !input right_double_action
                  else:
                    sequence:
                      - if: "{{ right_triple_entity not in ['', None] }}"
                        then:
                          - service: input_text.set_value
                            data:
                              entity_id: "{{ helper }}"
                              value: "{{ right_triple_entity }}"
                      - sequence: !input right_triple_action

      ##################################################################
      # LEFT BUTTON (cluster 5, args [257, 13, 0])
      ##################################################################
      - conditions:
          - condition: template
            value_template: "{{ command == 'press' and trigger.event.data.args == [257, 13, 0] }}"
        sequence:

          - if: "{{ left_single_entity not in ['', None] }}"
            then:
              - service: input_text.set_value
                data:
                  entity_id: "{{ helper }}"
                  value: "{{ left_single_entity }}"

          - wait_for_trigger:
              - trigger: event
                event_type: zha_event
                event_data:
                  device_id: !input remote
                  command: press
                  args: [257, 13, 0]
            timeout:
              milliseconds: !input press_timeout
            continue_on_timeout: true

          - if:
              - condition: template
                value_template: "{{ wait.trigger is none }}"
            then:
              sequence: !input left_single_action
            else:
              sequence:
                - if: "{{ left_double_entity not in ['', None] }}"
                  then:
                    - service: input_text.set_value
                      data:
                        entity_id: "{{ helper }}"
                        value: "{{ left_double_entity }}"

                - wait_for_trigger:
                    - trigger: event
                      event_type: zha_event
                      event_data:
                        device_id: !input remote
                        command: press
                        args: [257, 13, 0]
                  timeout:
                    milliseconds: !input press_timeout
                  continue_on_timeout: true

                - if:
                    - condition: template
                      value_template: "{{ wait.trigger is none }}"
                  then:
                    sequence: !input left_double_action
                  else:
                    sequence:
                      - if: "{{ left_triple_entity not in ['', None] }}"
                        then:
                          - service: input_text.set_value
                            data:
                              entity_id: "{{ helper }}"
                              value: "{{ left_triple_entity }}"
                      - sequence: !input left_triple_action

      ##################################################################
      # UP LONG-PRESS (cluster 8, move_with_on_off)
      ##################################################################
      - conditions:
          - condition: template
            value_template: "{{ cluster_id == 8 and command == 'move_with_on_off' }}"
        sequence:
          - repeat:
              sequence:
                - choose:
                    - conditions: "{{ last_domain == 'light' }}"
                      sequence:
                        - service: light.turn_on
                          data:
                            entity_id: "{{ last_entity }}"
                            brightness_step_pct: "{{ brightness_step | int }}"

                    - conditions: "{{ last_domain == 'media_player' }}"
                      sequence:
                        - service: media_player.volume_set
                          data:
                            entity_id: "{{ last_entity }}"
                            volume_level: >
                              {{ [ (state_attr(last_entity, 'volume_level') | float(0)) + (volume_step | float), 1.0 ] | min }}

                    - conditions: "{{ last_domain == 'fan' }}"
                      sequence:
                        - service: fan.set_percentage
                          data:
                            entity_id: "{{ last_entity }}"
                            percentage: >
                              {{ [ (state_attr(last_entity, 'percentage') | float(0)) + (brightness_step | int), 100 ] | min }}

                    - conditions: "{{ last_domain == 'climate' }}"
                      sequence:
                        - service: climate.set_temperature
                          data:
                            entity_id: "{{ last_entity }}"
                            temperature: >
                              {{ (state_attr(last_entity, 'temperature') | float(20)) + (volume_step | float) }}

                    - conditions: "{{ last_domain == 'cover' }}"
                      sequence:
                        - service: cover.open_cover
                          data:
                            entity_id: "{{ last_entity }}"

                    - conditions: "{{ last_domain == 'switch' }}"
                      sequence:
                        - service: switch.turn_on
                          data:
                            entity_id: "{{ last_entity }}"

                # Wait for stop or repeat interval — whichever comes first
                - wait_for_trigger:
                    - trigger: event
                      event_type: zha_event
                      event_data:
                        device_id: !input remote
                        command: stop_with_on_off
                    - trigger: event
                      event_type: zha_event
                      event_data:
                        device_id: !input remote
                        command: stop
                  timeout:
                    milliseconds: !input hold_repeat_interval
                  continue_on_timeout: true

              until:
                - condition: template
                  value_template: "{{ wait.trigger is not none }}"

      ##################################################################
      # DOWN LONG-PRESS (cluster 8, move)
      ##################################################################
      - conditions:
          - condition: template
            value_template: "{{ cluster_id == 8 and command == 'move' }}"
        sequence:
          - repeat:
              sequence:
                - choose:
                    - conditions: "{{ last_domain == 'light' }}"
                      sequence:
                        - service: light.turn_on
                          data:
                            entity_id: "{{ last_entity }}"
                            brightness_step_pct: "{{ (brightness_step | int) * -1 }}"

                    - conditions: "{{ last_domain == 'media_player' }}"
                      sequence:
                        - service: media_player.volume_set
                          data:
                            entity_id: "{{ last_entity }}"
                            volume_level: >
                              {{ [ (state_attr(last_entity, 'volume_level') | float(0)) - (volume_step | float), 0.0 ] | max }}

                    - conditions: "{{ last_domain == 'fan' }}"
                      sequence:
                        - service: fan.set_percentage
                          data:
                            entity_id: "{{ last_entity }}"
                            percentage: >
                              {{ [ (state_attr(last_entity, 'percentage') | float(0)) - (brightness_step | int), 0 ] | max }}

                    - conditions: "{{ last_domain == 'climate' }}"
                      sequence:
                        - service: climate.set_temperature
                          data:
                            entity_id: "{{ last_entity }}"
                            temperature: >
                              {{ (state_attr(last_entity, 'temperature') | float(20)) - (volume_step | float) }}

                    - conditions: "{{ last_domain == 'cover' }}"
                      sequence:
                        - service: cover.close_cover
                          data:
                            entity_id: "{{ last_entity }}"

                    - conditions: "{{ last_domain == 'switch' }}"
                      sequence:
                        - service: switch.turn_off
                          data:
                            entity_id: "{{ last_entity }}"

                - wait_for_trigger:
                    - trigger: event
                      event_type: zha_event
                      event_data:
                        device_id: !input remote
                        command: stop_with_on_off
                    - trigger: event
                      event_type: zha_event
                      event_data:
                        device_id: !input remote
                        command: stop
                  timeout:
                    milliseconds: !input hold_repeat_interval
                  continue_on_timeout: true

              until:
                - condition: template
                  value_template: "{{ wait.trigger is not none }}"
