blueprint:
  name: "IKEA Styrbar N2 Remote (ZHA) — MultiPress & Long-Press Repeat"
  description: >
    A clean, reliable automation blueprint for the IKEA Styrbar N2 remote using ZHA events.
    Supports single, double, and triple presses, UP/DOWN long-press with repeat for brightness/volume, and tracks last entity.

  domain: automation

  input:
    remote:
      name: Styrbar Remote (ZHA)
      selector:
        device:
          integration: zha
          manufacturer: "IKEA of Sweden"
          model: "Remote Control N2"

    last_action_helper:
      name: Last Action Helper (input_text)
      selector:
        entity:
          domain: input_text

    press_timeout:
      name: Multi‑press timeout (ms)
      default: 350
      selector:
        number:
          min: 150
          max: 1000
          step: 50
          unit_of_measurement: ms

    hold_repeat_interval:
      name: Long‑press repeat interval (ms)
      default: 300
      selector:
        number:
          min: 100
          max: 1000
          step: 50
          unit_of_measurement: ms

    brightness_step:
      name: Brightness step (%)
      default: 10
      selector:
        number:
          min: 1
          max: 50
          step: 1

    volume_step:
      name: Volume step (0.01–0.20)
      default: 0.05
      selector:
        number:
          min: 0.01
          max: 0.20
          step: 0.01

    debug_mode:
      name: Enable debug logging
      default: false
      selector:
        boolean: {}

mode: restart

trigger:
  - platform: event
    event_type: zha_event
    event_data:
      device_id: !input remote

variables:
  press_timeout: !input press_timeout
  hold_repeat_interval: !input hold_repeat_interval
  brightness_step: !input brightness_step
  volume_step: !input volume_step
  debug: !input debug_mode

  helper: !input last_action_helper
  last_entity: "{{ states(helper) }}"

  button: >
    {% if trigger.event.data.cluster_id == 6 and trigger.event.data.command == 'on' %}
      up
    {% elif trigger.event.data.cluster_id == 6 and trigger.event.data.command == 'off' %}
      down
    {% elif trigger.event.data.cluster_id == 5 and trigger.event.data.command == 'press' and trigger.event.data.args == [257, 13, 0] %}
      left
    {% elif trigger.event.data.cluster_id == 5 and trigger.event.data.command == 'press' and trigger.event.data.args == [256, 13, 0] %}
      right
    {% else %}
      unknown
    {% endif %}

  press_type: >
    {% if trigger.event.data.command in ['on','off','press'] %}
      single
    {% elif trigger.event.data.command in ['move', 'move_with_on_off'] %}
      long
    {% else %}
      single
    {% endif %}

  mapped_entity: >
    {% set key = button ~ '_' ~ press_type ~ '_entity' %}
    {% set e = vars().get(key) %}
    {% if e in ['', None] %}
      none
    {% else %}
      {{ e }}
    {% endif %}

action:

  - choose:
      - conditions: "{{ debug }}"
        sequence:
          - service: system_log.write
            data:
              message: "Styrbar Debug: button={{ button }}, press_type={{ press_type }}, mapped_entity={{ mapped_entity }}"
              level: info

  - choose:
      - conditions: "{{ mapped_entity != 'none' }}"
        sequence:
          - service: input_text.set_value
            data:
              entity_id: "{{ helper }}"
              value: "{{ mapped_entity }}"
      - conditions: "{{ mapped_entity == 'none' }}"
        sequence:
          - service: input_text.set_value
            data:
              entity_id: "{{ helper }}"
              value: ""

  # Multi-press (Single, Double, Triple)
  - choose:
      - conditions: "{{ button == 'up' and press_type == 'single' }}"
        sequence: !input up_single_action
      - conditions: "{{ button == 'down' and press_type == 'single' }}"
        sequence: !input down_single_action

  # Long-Press Repeat (UP/DOWN only)
  - choose:
      - conditions: "{{ button == 'up' and press_type == 'long' }}"
        sequence:
          - repeat:
              sequence:
                - choose:
                    - conditions: "{{ last_entity is not none }}"
                      sequence:
                        - service: light.turn_on
                          data:
                            entity_id: "{{ last_entity }}"
                            brightness_step_pct: "{{ brightness_step }}"
                - wait_for_trigger:
                    - platform: event
                      event_type: zha_event
                      event_data:
                        device_id: !input remote
                        cluster_id: 8
                        command: stop
                  timeout: 0
                  continue_on_timeout: false
                - delay:
                    milliseconds: "{{ hold_repeat_interval }}"
              until:
                - condition: template
                  value_template: "{{ wait.trigger is not none }}"
          
  - choose:
      - conditions: "{{ button == 'down' and press_type == 'long' }}"
        sequence:
          - repeat:
              sequence:
                - choose:
                    - conditions: "{{ last_entity is not none }}"
                      sequence:
                        - service: media_player.volume_set
                          data:
                            entity_id: "{{ last_entity }}"
                            volume_level: "{{ (state_attr(last_entity, 'volume_level') | float(0)) + volume_step }}"
                - wait_for_trigger:
                    - platform: event
                      event_type: zha_event
                      event_data:
                        device_id: !input remote
                        cluster_id: 8
                        command: stop
                  timeout: 0
                  continue_on_timeout: false
                - delay:
                    milliseconds: "{{ hold_repeat_interval }}"
              until:
                - condition: template
                  value_template: "{{ wait.trigger is not none }}"
