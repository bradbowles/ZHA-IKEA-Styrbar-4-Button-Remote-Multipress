blueprint:
  name: "ZHA - IKEA Styrbar N2 (4-Button) — Multipress 1–3 + UP/DOWN Long-Press Repeat"
  description: >
    Styrbar N2 blueprint with reliable multi-press (1–3) on all four buttons
    and UP/DOWN long-press repeat for light brightness, media volume, fan speed,
    climate temperature, and cover position.

    The long-press target entity is automatically extracted from whichever
    action was last fired — no separate entity inputs needed.

    Requires one input_text helper (max length >= 50).

  domain: automation

  input:

    remote:
      name: Styrbar Remote (ZHA)
      selector:
        device:
          integration: zha
          manufacturer: "IKEA of Sweden"
          model: "Remote Control N2"

    last_action_helper:
      name: Last Action Helper (input_text)
      description: >
        Stores the entity last used so UP/DOWN long-press knows what to control.
        Create an input_text helper with max length >= 50.
      selector:
        entity:
          domain: input_text

    press_timeout:
      name: Multi-press timeout (ms)
      default: 500
      selector:
        number:
          min: 100
          max: 2000
          step: 100
          unit_of_measurement: milliseconds
          mode: slider

    hold_repeat_interval:
      name: Long-press repeat interval (ms)
      default: 300
      selector:
        number:
          min: 100
          max: 1000
          step: 50
          unit_of_measurement: ms

    brightness_step:
      name: Brightness / fan step (%)
      default: 10
      selector:
        number:
          min: 1
          max: 50
          step: 1

    cover_step:
      name: Cover position step (%)
      default: 10
      selector:
        number:
          min: 1
          max: 50
          step: 1

    volume_step:
      name: Volume / climate step
      default: 0.05
      selector:
        number:
          min: 0.01
          max: 0.20
          step: 0.01

    debug_mode:
      name: Enable debug logging
      default: false
      selector:
        boolean: {}

    ############################################################
    # ACTION INPUTS
    ############################################################

    up_single_action:
      name: UP - Single Press
      selector: { action: {} }
      default: []

    up_double_action:
      name: UP - Double Press
      selector: { action: {} }
      default: []

    up_triple_action:
      name: UP - Triple Press
      selector: { action: {} }
      default: []

    down_single_action:
      name: DOWN - Single Press
      selector: { action: {} }
      default: []

    down_double_action:
      name: DOWN - Double Press
      selector: { action: {} }
      default: []

    down_triple_action:
      name: DOWN - Triple Press
      selector: { action: {} }
      default: []

    left_single_action:
      name: LEFT - Single Press
      selector: { action: {} }
      default: []

    left_double_action:
      name: LEFT - Double Press
      selector: { action: {} }
      default: []

    left_triple_action:
      name: LEFT - Triple Press
      selector: { action: {} }
      default: []

    right_single_action:
      name: RIGHT - Single Press
      selector: { action: {} }
      default: []

    right_double_action:
      name: RIGHT - Double Press
      selector: { action: {} }
      default: []

    right_triple_action:
      name: RIGHT - Triple Press
      selector: { action: {} }
      default: []

mode: single
max_exceeded: silent

trigger:
  - trigger: event
    event_type: zha_event
    event_data:
      device_id: !input remote

conditions:
  - condition: template
    value_template: >
      {{ trigger.event.data.command in ['on', 'off', 'press', 'release',
         'move_with_on_off', 'move', 'stop_with_on_off', 'stop'] }}
  # Reject attribute_updated events fired alongside on/off presses
  - condition: template
    value_template: "{{ trigger.event.data.command != 'attribute_updated' }}"

variables:
  helper: !input last_action_helper
  brightness_step: !input brightness_step
  cover_step: !input cover_step
  volume_step: !input volume_step
  hold_repeat_interval: !input hold_repeat_interval
  debug: !input debug_mode

  command: "{{ trigger.event.data.command }}"
  cluster_id: "{{ trigger.event.data.cluster_id | default(-1) | int }}"

  # Resolved action lists for entity extraction
  up_single_action:    !input up_single_action
  up_double_action:    !input up_double_action
  up_triple_action:    !input up_triple_action
  down_single_action:  !input down_single_action
  down_double_action:  !input down_double_action
  down_triple_action:  !input down_triple_action
  left_single_action:  !input left_single_action
  left_double_action:  !input left_double_action
  left_triple_action:  !input left_triple_action
  right_single_action: !input right_single_action
  right_double_action: !input right_double_action
  right_triple_action: !input right_triple_action

  # Last entity stored in helper (for long-press targeting)
  last_entity: "{{ states(helper) }}"
  last_domain: >
    {% if last_entity and '.' in last_entity %}
      {{ last_entity.split('.')[0] }}
    {% else %}
      none
    {% endif %}

actions:

  ############################################################
  # DEBUG LOGGING
  ############################################################
  - if: "{{ debug }}"
    then:
      - service: system_log.write
        data:
          message: >
            STYRBAR DEBUG — command={{ command }}, cluster_id={{ cluster_id }},
            last_entity={{ last_entity }}, last_domain={{ last_domain }}
          level: info

  - choose:

      ##################################################################
      # UP BUTTON (command: "on", cluster_id: 6)
      # attribute_updated is now filtered at the conditions level so
      # wait_for_trigger only sees genuine command: "on" events,
      # giving exactly 1 event per physical press.
      ##################################################################
      - conditions:
          - condition: template
            value_template: "{{ command == 'on' }}"
        sequence:
          - wait_for_trigger:
              - trigger: event
                event_type: zha_event
                event_data:
                    device_id: !input remote
                    cluster_id: 6
                    command: "on"
            timeout:
              milliseconds: !input press_timeout
            continue_on_timeout: true
          - if:
              - condition: template
                value_template: "{{ wait.trigger is none }}"
            then:
              # SINGLE
              - sequence: !input up_single_action
              - variables:
                  _entity: >
                    {% set a = up_single_action %}
                    {% set _eid = a[0].target.entity_id if (a | length > 0 and a[0].target is defined and a[0].target.entity_id is defined) else (a[0].data.entity_id if (a | length > 0 and a[0].data is defined and a[0].data.entity_id is defined) else last_entity) %}
                    {% if _eid is string %}{{ _eid }}{% elif _eid is iterable and _eid | length > 0 %}{{ _eid[0] }}{% else %}{{ last_entity }}{% endif %}
              - if: "{{ _entity not in ['', None, 'none'] }}"
                then:
                  - service: input_text.set_value
                    data:
                      entity_id: "{{ helper }}"
                      value: "{{ _entity }}"
            else:
              sequence:
                - wait_for_trigger:
                    - trigger: event
                      event_type: zha_event
                      event_data:
                          device_id: !input remote
                          cluster_id: 6
                          command: "on"
                  timeout:
                    milliseconds: !input press_timeout
                  continue_on_timeout: true
                - if:
                    - condition: template
                      value_template: "{{ wait.trigger is none }}"
                  then:
                    # DOUBLE
                    - sequence: !input up_double_action
                    - variables:
                        _entity: >
                          {% set a = up_double_action %}
                          {% set _eid = a[0].target.entity_id if (a | length > 0 and a[0].target is defined and a[0].target.entity_id is defined) else (a[0].data.entity_id if (a | length > 0 and a[0].data is defined and a[0].data.entity_id is defined) else last_entity) %}
                          {% if _eid is string %}{{ _eid }}{% elif _eid is iterable and _eid | length > 0 %}{{ _eid[0] }}{% else %}{{ last_entity }}{% endif %}
                    - if: "{{ _entity not in ['', None, 'none'] }}"
                      then:
                        - service: input_text.set_value
                          data:
                            entity_id: "{{ helper }}"
                            value: "{{ _entity }}"
                  else:
                    # TRIPLE
                    - sequence: !input up_triple_action
                    - variables:
                        _entity: >
                          {% set a = up_triple_action %}
                          {% set _eid = a[0].target.entity_id if (a | length > 0 and a[0].target is defined and a[0].target.entity_id is defined) else (a[0].data.entity_id if (a | length > 0 and a[0].data is defined and a[0].data.entity_id is defined) else last_entity) %}
                          {% if _eid is string %}{{ _eid }}{% elif _eid is iterable and _eid | length > 0 %}{{ _eid[0] }}{% else %}{{ last_entity }}{% endif %}
                    - if: "{{ _entity not in ['', None, 'none'] }}"
                      then:
                        - service: input_text.set_value
                          data:
                            entity_id: "{{ helper }}"
                            value: "{{ _entity }}"

      ##################################################################
      # DOWN BUTTON (command: "off", cluster_id: 6)
      # attribute_updated is now filtered at the conditions level so
      # wait_for_trigger only sees genuine command: "off" events,
      # giving exactly 1 event per physical press.
      ##################################################################
      - conditions:
          - condition: template
            value_template: "{{ command == 'off' }}"
        sequence:
          - wait_for_trigger:
              - trigger: event
                event_type: zha_event
                event_data:
                    device_id: !input remote
                    cluster_id: 6
                    command: "off"
            timeout:
              milliseconds: !input press_timeout
            continue_on_timeout: true
          - if:
              - condition: template
                value_template: "{{ wait.trigger is none }}"
            then:
              # SINGLE
              - sequence: !input down_single_action
              - variables:
                  _entity: >
                    {% set a = down_single_action %}
                    {% set _eid = a[0].target.entity_id if (a | length > 0 and a[0].target is defined and a[0].target.entity_id is defined) else (a[0].data.entity_id if (a | length > 0 and a[0].data is defined and a[0].data.entity_id is defined) else last_entity) %}
                    {% if _eid is string %}{{ _eid }}{% elif _eid is iterable and _eid | length > 0 %}{{ _eid[0] }}{% else %}{{ last_entity }}{% endif %}
              - if: "{{ _entity not in ['', None, 'none'] }}"
                then:
                  - service: input_text.set_value
                    data:
                      entity_id: "{{ helper }}"
                      value: "{{ _entity }}"
            else:
              sequence:
                - wait_for_trigger:
                    - trigger: event
                      event_type: zha_event
                      event_data:
                          device_id: !input remote
                          cluster_id: 6
                          command: "off"
                  timeout:
                    milliseconds: !input press_timeout
                  continue_on_timeout: true
                - if:
                    - condition: template
                      value_template: "{{ wait.trigger is none }}"
                  then:
                    # DOUBLE
                    - sequence: !input down_double_action
                    - variables:
                        _entity: >
                          {% set a = down_double_action %}
                          {% set _eid = a[0].target.entity_id if (a | length > 0 and a[0].target is defined and a[0].target.entity_id is defined) else (a[0].data.entity_id if (a | length > 0 and a[0].data is defined and a[0].data.entity_id is defined) else last_entity) %}
                          {% if _eid is string %}{{ _eid }}{% elif _eid is iterable and _eid | length > 0 %}{{ _eid[0] }}{% else %}{{ last_entity }}{% endif %}
                    - if: "{{ _entity not in ['', None, 'none'] }}"
                      then:
                        - service: input_text.set_value
                          data:
                            entity_id: "{{ helper }}"
                            value: "{{ _entity }}"
                  else:
                    # TRIPLE
                    - sequence: !input down_triple_action
                    - variables:
                        _entity: >
                          {% set a = down_triple_action %}
                          {% set _eid = a[0].target.entity_id if (a | length > 0 and a[0].target is defined and a[0].target.entity_id is defined) else (a[0].data.entity_id if (a | length > 0 and a[0].data is defined and a[0].data.entity_id is defined) else last_entity) %}
                          {% if _eid is string %}{{ _eid }}{% elif _eid is iterable and _eid | length > 0 %}{{ _eid[0] }}{% else %}{{ last_entity }}{% endif %}
                    - if: "{{ _entity not in ['', None, 'none'] }}"
                      then:
                        - service: input_text.set_value
                          data:
                            entity_id: "{{ helper }}"
                            value: "{{ _entity }}"

      # RIGHT BUTTON (args [256, 13, 0])
      ##################################################################
      - conditions:
          - condition: template
            value_template: "{{ command == 'press' and trigger.event.data.args == [256, 13, 0] }}"
        sequence:
          - wait_for_trigger:
              - trigger: event
                event_type: zha_event
                event_data:
                  device_id: !input remote
                  command: press
                  args: [256, 13, 0]
            timeout:
              milliseconds: !input press_timeout
            continue_on_timeout: true

          - if:
              - condition: template
                value_template: "{{ wait.trigger is none }}"
            then:
              # SINGLE
              - sequence: !input right_single_action
              - variables:
                  _entity: >
                    {% set a = right_single_action %}
                    {% set _eid = a[0].target.entity_id if (a | length > 0 and a[0].target is defined and a[0].target.entity_id is defined) else (a[0].data.entity_id if (a | length > 0 and a[0].data is defined and a[0].data.entity_id is defined) else last_entity) %}
                    {% if _eid is string %}{{ _eid }}{% elif _eid is iterable and _eid | length > 0 %}{{ _eid[0] }}{% else %}{{ last_entity }}{% endif %}
              - if: "{{ _entity not in ['', None, 'none'] }}"
                then:
                  - service: input_text.set_value
                    data:
                      entity_id: "{{ helper }}"
                      value: "{{ _entity }}"
            else:
              sequence:
                - wait_for_trigger:
                    - trigger: event
                      event_type: zha_event
                      event_data:
                        device_id: !input remote
                        command: press
                        args: [256, 13, 0]
                  timeout:
                    milliseconds: !input press_timeout
                  continue_on_timeout: true

                - if:
                    - condition: template
                      value_template: "{{ wait.trigger is none }}"
                  then:
                    # DOUBLE
                    - sequence: !input right_double_action
                    - variables:
                        _entity: >
                          {% set a = right_double_action %}
                          {% set _eid = a[0].target.entity_id if (a | length > 0 and a[0].target is defined and a[0].target.entity_id is defined) else (a[0].data.entity_id if (a | length > 0 and a[0].data is defined and a[0].data.entity_id is defined) else last_entity) %}
                          {% if _eid is string %}{{ _eid }}{% elif _eid is iterable and _eid | length > 0 %}{{ _eid[0] }}{% else %}{{ last_entity }}{% endif %}
                    - if: "{{ _entity not in ['', None, 'none'] }}"
                      then:
                        - service: input_text.set_value
                          data:
                            entity_id: "{{ helper }}"
                            value: "{{ _entity }}"
                  else:
                    # TRIPLE
                    - sequence: !input right_triple_action
                    - variables:
                        _entity: >
                          {% set a = right_triple_action %}
                          {% set _eid = a[0].target.entity_id if (a | length > 0 and a[0].target is defined and a[0].target.entity_id is defined) else (a[0].data.entity_id if (a | length > 0 and a[0].data is defined and a[0].data.entity_id is defined) else last_entity) %}
                          {% if _eid is string %}{{ _eid }}{% elif _eid is iterable and _eid | length > 0 %}{{ _eid[0] }}{% else %}{{ last_entity }}{% endif %}
                    - if: "{{ _entity not in ['', None, 'none'] }}"
                      then:
                        - service: input_text.set_value
                          data:
                            entity_id: "{{ helper }}"
                            value: "{{ _entity }}"

      ##################################################################
      # LEFT BUTTON (args [257, 13, 0])
      ##################################################################
      - conditions:
          - condition: template
            value_template: "{{ command == 'press' and trigger.event.data.args == [257, 13, 0] }}"
        sequence:
          - wait_for_trigger:
              - trigger: event
                event_type: zha_event
                event_data:
                  device_id: !input remote
                  command: press
                  args: [257, 13, 0]
            timeout:
              milliseconds: !input press_timeout
            continue_on_timeout: true

          - if:
              - condition: template
                value_template: "{{ wait.trigger is none }}"
            then:
              # SINGLE
              - sequence: !input left_single_action
              - variables:
                  _entity: >
                    {% set a = left_single_action %}
                    {% set _eid = a[0].target.entity_id if (a | length > 0 and a[0].target is defined and a[0].target.entity_id is defined) else (a[0].data.entity_id if (a | length > 0 and a[0].data is defined and a[0].data.entity_id is defined) else last_entity) %}
                    {% if _eid is string %}{{ _eid }}{% elif _eid is iterable and _eid | length > 0 %}{{ _eid[0] }}{% else %}{{ last_entity }}{% endif %}
              - if: "{{ _entity not in ['', None, 'none'] }}"
                then:
                  - service: input_text.set_value
                    data:
                      entity_id: "{{ helper }}"
                      value: "{{ _entity }}"
            else:
              sequence:
                - wait_for_trigger:
                    - trigger: event
                      event_type: zha_event
                      event_data:
                        device_id: !input remote
                        command: press
                        args: [257, 13, 0]
                  timeout:
                    milliseconds: !input press_timeout
                  continue_on_timeout: true

                - if:
                    - condition: template
                      value_template: "{{ wait.trigger is none }}"
                  then:
                    # DOUBLE
                    - sequence: !input left_double_action
                    - variables:
                        _entity: >
                          {% set a = left_double_action %}
                          {% set _eid = a[0].target.entity_id if (a | length > 0 and a[0].target is defined and a[0].target.entity_id is defined) else (a[0].data.entity_id if (a | length > 0 and a[0].data is defined and a[0].data.entity_id is defined) else last_entity) %}
                          {% if _eid is string %}{{ _eid }}{% elif _eid is iterable and _eid | length > 0 %}{{ _eid[0] }}{% else %}{{ last_entity }}{% endif %}
                    - if: "{{ _entity not in ['', None, 'none'] }}"
                      then:
                        - service: input_text.set_value
                          data:
                            entity_id: "{{ helper }}"
                            value: "{{ _entity }}"
                  else:
                    # TRIPLE
                    - sequence: !input left_triple_action
                    - variables:
                        _entity: >
                          {% set a = left_triple_action %}
                          {% set _eid = a[0].target.entity_id if (a | length > 0 and a[0].target is defined and a[0].target.entity_id is defined) else (a[0].data.entity_id if (a | length > 0 and a[0].data is defined and a[0].data.entity_id is defined) else last_entity) %}
                          {% if _eid is string %}{{ _eid }}{% elif _eid is iterable and _eid | length > 0 %}{{ _eid[0] }}{% else %}{{ last_entity }}{% endif %}
                    - if: "{{ _entity not in ['', None, 'none'] }}"
                      then:
                        - service: input_text.set_value
                          data:
                            entity_id: "{{ helper }}"
                            value: "{{ _entity }}"

      ##################################################################
      # UP LONG-PRESS (cluster 8, move_with_on_off)
      # The wait_for_trigger is placed FIRST in the loop and doubles
      # as the repeat delay. If stop arrives the until: exits cleanly.
      # If it times out the service fires and we loop again.
      # Safety net: repeat.index >= 30 (~9 seconds at 300ms interval).
      ##################################################################
      - conditions:
          - condition: template
            value_template: "{{ cluster_id == 8 and command == 'move_with_on_off' }}"
        sequence:
          # Fire immediately on first iteration before waiting
          - choose:
              - conditions: "{{ last_domain == 'light' }}"
                sequence:
                  - service: light.turn_on
                    data:
                      entity_id: "{{ last_entity }}"
                      brightness_step_pct: "{{ brightness_step | int }}"
              - conditions: "{{ last_domain == 'media_player' }}"
                sequence:
                  - service: media_player.volume_set
                    data:
                      entity_id: "{{ last_entity }}"
                      volume_level: >
                        {{ [ (state_attr(last_entity, 'volume_level') | float(0)) + (volume_step | float), 1.0 ] | min }}
              - conditions: "{{ last_domain == 'fan' }}"
                sequence:
                  - service: fan.set_percentage
                    data:
                      entity_id: "{{ last_entity }}"
                      percentage: >
                        {{ [ (state_attr(last_entity, 'percentage') | float(0)) + (brightness_step | int), 100 ] | min }}
              - conditions: "{{ last_domain == 'climate' }}"
                sequence:
                  - service: climate.set_temperature
                    data:
                      entity_id: "{{ last_entity }}"
                      temperature: >
                        {{ (state_attr(last_entity, 'temperature') | float(20)) + (volume_step | float) }}
              - conditions: "{{ last_domain == 'cover' }}"
                sequence:
                  - service: cover.set_cover_position
                    data:
                      entity_id: "{{ last_entity }}"
                      position: >
                        {{ [ (state_attr(last_entity, 'current_position') | float(0)) + (cover_step | int), 100 ] | min }}
          - repeat:
              sequence:
                # Wait for stop event — this IS the repeat delay.
                # If stop arrives before timeout: exit loop.
                # If timeout: fire the service and repeat.
                - wait_for_trigger:
                    - trigger: event
                      event_type: zha_event
                      event_data:
                        device_id: !input remote
                        command: stop_with_on_off
                    - trigger: event
                      event_type: zha_event
                      event_data:
                        device_id: !input remote
                        command: stop
                  timeout:
                    milliseconds: !input hold_repeat_interval
                  continue_on_timeout: true
                # Only fire service if stop did NOT arrive
                - if: "{{ wait.trigger is none }}"
                  then:
                    - choose:
                        - conditions: "{{ last_domain == 'light' }}"
                          sequence:
                            - service: light.turn_on
                              data:
                                entity_id: "{{ last_entity }}"
                                brightness_step_pct: "{{ brightness_step | int }}"
                        - conditions: "{{ last_domain == 'media_player' }}"
                          sequence:
                            - service: media_player.volume_set
                              data:
                                entity_id: "{{ last_entity }}"
                                volume_level: >
                                  {{ [ (state_attr(last_entity, 'volume_level') | float(0)) + (volume_step | float), 1.0 ] | min }}
                        - conditions: "{{ last_domain == 'fan' }}"
                          sequence:
                            - service: fan.set_percentage
                              data:
                                entity_id: "{{ last_entity }}"
                                percentage: >
                                  {{ [ (state_attr(last_entity, 'percentage') | float(0)) + (brightness_step | int), 100 ] | min }}
                        - conditions: "{{ last_domain == 'climate' }}"
                          sequence:
                            - service: climate.set_temperature
                              data:
                                entity_id: "{{ last_entity }}"
                                temperature: >
                                  {{ (state_attr(last_entity, 'temperature') | float(20)) + (volume_step | float) }}
                        - conditions: "{{ last_domain == 'cover' }}"
                          sequence:
                            - service: cover.set_cover_position
                              data:
                                entity_id: "{{ last_entity }}"
                                position: >
                                  {{ [ (state_attr(last_entity, 'current_position') | float(0)) + (cover_step | int), 100 ] | min }}
              until:
                - condition: template
                  value_template: >
                    {{ wait.trigger is not none or repeat.index >= 30 }}

      ##################################################################
      # DOWN LONG-PRESS (cluster 8, move)
      # The wait_for_trigger is placed FIRST in the loop and doubles
      # as the repeat delay. If stop arrives the until: exits cleanly.
      # If it times out the service fires and we loop again.
      # Safety net: repeat.index >= 30 (~9 seconds at 300ms interval).
      ##################################################################
      - conditions:
          - condition: template
            value_template: "{{ cluster_id == 8 and command == 'move' }}"
        sequence:
          # Fire immediately on first iteration before waiting
          - choose:
              - conditions: "{{ last_domain == 'light' }}"
                sequence:
                  - service: light.turn_on
                    data:
                      entity_id: "{{ last_entity }}"
                      brightness_step_pct: "{{ (brightness_step | int) * -1 }}"
              - conditions: "{{ last_domain == 'media_player' }}"
                sequence:
                  - service: media_player.volume_set
                    data:
                      entity_id: "{{ last_entity }}"
                      volume_level: >
                        {{ [ (state_attr(last_entity, 'volume_level') | float(0)) - (volume_step | float), 0.0 ] | max }}
              - conditions: "{{ last_domain == 'fan' }}"
                sequence:
                  - service: fan.set_percentage
                    data:
                      entity_id: "{{ last_entity }}"
                      percentage: >
                        {{ [ (state_attr(last_entity, 'percentage') | float(100)) - (brightness_step | int), 0 ] | max }}
              - conditions: "{{ last_domain == 'climate' }}"
                sequence:
                  - service: climate.set_temperature
                    data:
                      entity_id: "{{ last_entity }}"
                      temperature: >
                        {{ (state_attr(last_entity, 'temperature') | float(20)) - (volume_step | float) }}
              - conditions: "{{ last_domain == 'cover' }}"
                sequence:
                  - service: cover.set_cover_position
                    data:
                      entity_id: "{{ last_entity }}"
                      position: >
                        {{ [ (state_attr(last_entity, 'current_position') | float(100)) - (cover_step | int), 0 ] | max }}
          - repeat:
              sequence:
                # Wait for stop event — this IS the repeat delay.
                # If stop arrives before timeout: exit loop.
                # If timeout: fire the service and repeat.
                - wait_for_trigger:
                    - trigger: event
                      event_type: zha_event
                      event_data:
                        device_id: !input remote
                        command: stop_with_on_off
                    - trigger: event
                      event_type: zha_event
                      event_data:
                        device_id: !input remote
                        command: stop
                  timeout:
                    milliseconds: !input hold_repeat_interval
                  continue_on_timeout: true
                # Only fire service if stop did NOT arrive
                - if: "{{ wait.trigger is none }}"
                  then:
                    - choose:
                        - conditions: "{{ last_domain == 'light' }}"
                          sequence:
                            - service: light.turn_on
                              data:
                                entity_id: "{{ last_entity }}"
                                brightness_step_pct: "{{ (brightness_step | int) * -1 }}"
                        - conditions: "{{ last_domain == 'media_player' }}"
                          sequence:
                            - service: media_player.volume_set
                              data:
                                entity_id: "{{ last_entity }}"
                                volume_level: >
                                  {{ [ (state_attr(last_entity, 'volume_level') | float(0)) - (volume_step | float), 0.0 ] | max }}
                        - conditions: "{{ last_domain == 'fan' }}"
                          sequence:
                            - service: fan.set_percentage
                              data:
                                entity_id: "{{ last_entity }}"
                                percentage: >
                                  {{ [ (state_attr(last_entity, 'percentage') | float(100)) - (brightness_step | int), 0 ] | max }}
                        - conditions: "{{ last_domain == 'climate' }}"
                          sequence:
                            - service: climate.set_temperature
                              data:
                                entity_id: "{{ last_entity }}"
                                temperature: >
                                  {{ (state_attr(last_entity, 'temperature') | float(20)) - (volume_step | float) }}
                        - conditions: "{{ last_domain == 'cover' }}"
                          sequence:
                            - service: cover.set_cover_position
                              data:
                                entity_id: "{{ last_entity }}"
                                position: >
                                  {{ [ (state_attr(last_entity, 'current_position') | float(100)) - (cover_step | int), 0 ] | max }}
              until:
                - condition: template
                  value_template: >
                    {{ wait.trigger is not none or repeat.index >= 30 }}
